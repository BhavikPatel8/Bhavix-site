<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 – Page not found</title>
<style>
  :root{
    --bg1:#080e20; --bg2:#16223d; --bg3:#2e3c55;
    --panel:#0f1830; --edge:#25314f;
    --text:#f2f5fb; --muted:#9aa6c0;
    --blue:#8fb0ff; --violet:#8a6bff; --amber:#ffb020;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:linear-gradient(140deg,var(--bg1) 0%,var(--bg2) 58%,var(--bg3) 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  #stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  main{
    position:relative;z-index:1;min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 20px;text-align:center;
  }

  /* ---- the big 404 ---- */
  .digits{
    --size:clamp(104px,26vw,270px);
    font-size:var(--size);line-height:1;font-weight:800;letter-spacing:-.04em;
    display:flex;align-items:center;justify-content:center;gap:.04em;
    transform:translate3d(var(--px,0),var(--py,0),0);
    transition:transform .25s ease-out;
    user-select:none;
  }
  .four{
    display:inline-block;
    background:linear-gradient(160deg,#dfe8ff 0%,var(--blue) 45%,var(--violet) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 14px 40px rgba(110,130,255,.35));
    opacity:0;animation:drop .9s cubic-bezier(.2,.9,.25,1.15) forwards, bob 6s ease-in-out 1.2s infinite;
  }
  .four.l{animation-delay:.15s,1.2s}
  .four.r{animation-delay:.45s,1.8s}
  @keyframes drop{from{opacity:0;transform:translateY(-70px) rotate(-6deg)}to{opacity:1;transform:none}}
  @keyframes bob{50%{transform:translateY(-10px)}}

  /* the zero is a portal with a small lost moon circling it */
  .portal{
    width:.74em;height:.74em;display:inline-block;position:relative;
    opacity:0;animation:pop .9s cubic-bezier(.2,.9,.25,1.2) .3s forwards;
  }
  @keyframes pop{from{opacity:0;transform:scale(.3) rotate(-90deg)}to{opacity:1;transform:none}}
  .portal svg{width:100%;height:100%;overflow:visible}
  .ring-dash{transform-origin:50% 50%;animation:spin 26s linear infinite}
  .ring-main{filter:drop-shadow(0 0 14px rgba(143,176,255,.55))}
  .moon{transform-origin:50% 50%;animation:spin 5.5s linear infinite}
  .core{transform-origin:50% 50%;animation:breathe 4s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{50%{opacity:.55;transform:scale(1.08)}}

  /* ---- message ---- */
  .msg{
    margin-top:clamp(16px,3vh,30px);
    opacity:0;transform:translateY(14px);
    animation:fadeUp .8s ease 1.1s forwards;
  }
  @keyframes fadeUp{to{opacity:1;transform:none}}
  h1{margin:0 0 10px;font-size:clamp(24px,4.4vw,34px);font-weight:700;letter-spacing:-.01em}
  .msg p{margin:0 auto;max-width:440px;line-height:1.6;font-size:16px;color:var(--muted)}
  .path{
    display:inline-block;margin:18px 0 0;max-width:min(92vw,460px);
    padding:8px 14px;border-radius:12px;
    background:rgba(15,24,48,.8);border:1px solid var(--edge);
    font:14px/1.3 ui-monospace,"Cascadia Mono",Consolas,monospace;color:#c9d6f5;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top;
  }
  .path i{font-style:normal;color:var(--amber);margin-right:8px}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .btn{
    font:inherit;font-size:16px;font-weight:600;color:var(--text);text-decoration:none;cursor:pointer;
    padding:15px 28px;border-radius:16px;border:1px solid #38425e;background:#232b40;
    transition:transform .18s,box-shadow .25s,border-color .25s,background .25s;
  }
  .btn:hover{transform:translateY(-3px);border-color:#5b6b9a;box-shadow:0 12px 28px rgba(0,0,0,.35)}
  .btn:active{transform:scale(.96)}
  .btn.primary{
    background:linear-gradient(135deg,#2f4290,#5a3fc0);border-color:#6d84e8;
  }
  .btn.primary:hover{box-shadow:0 12px 34px rgba(100,120,255,.45)}
  .btn:focus-visible{outline:2px solid #b4c7ff;outline-offset:3px}

  /* shooting star */
  .shoot{
    position:fixed;z-index:0;width:140px;height:2px;pointer-events:none;opacity:0;
    background:linear-gradient(90deg,rgba(255,255,255,0),#fff);
    transform:rotate(-28deg);
  }
  .shoot.go{animation:shoot 1.1s ease-out forwards}
  @keyframes shoot{
    0%{opacity:0;transform:translate(0,0) rotate(-28deg)}
    15%{opacity:1}
    100%{opacity:0;transform:translate(-520px,280px) rotate(-28deg)}
  }

  @media (max-width:480px){
    .actions .btn{flex:1 1 100%;text-align:center}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="shoot" id="shoot" aria-hidden="true"></div>

  <main>
    <div class="digits" id="digits" role="img" aria-label="Error 404">
      <span class="four l">4</span>

      <span class="portal">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#dfe8ff"/><stop offset=".5" stop-color="#8fb0ff"/><stop offset="1" stop-color="#8a6bff"/>
            </linearGradient>
            <radialGradient id="cg" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#8a6bff" stop-opacity=".55"/><stop offset="1" stop-color="#8a6bff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle class="core" cx="100" cy="100" r="62" fill="url(#cg)"/>
          <circle class="ring-dash" cx="100" cy="100" r="96" fill="none" stroke="#8fb0ff" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 12" stroke-linecap="round"/>
          <circle class="ring-main" cx="100" cy="100" r="76" fill="none" stroke="url(#rg)" stroke-width="22"/>
          <g class="moon"><circle cx="100" cy="4" r="9" fill="#ffb020"/><circle cx="100" cy="4" r="16" fill="#ffb020" opacity=".25"/></g>
        </svg>
      </span>

      <span class="four r">4</span>
    </div>

    <section class="msg">
      <h1>Page not found</h1>
      <p>This address doesn’t lead anywhere. The page may have moved, or the link may have a typo.</p>
      <span class="path" id="path" title=""><i>Requested</i><span id="pathText">/</span></span>
      <div class="actions">
        <a class="btn primary" href="/">Go home</a>
        <a class="btn" href="javascript:history.back()">Go back</a>
      </div>
    </section>
  </main>

<script>
(function(){
  /* show the missing path */
  var p=(location.pathname+location.search)||'/';
  var t=document.getElementById('pathText');
  t.textContent=p;document.getElementById('path').title=p;

  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* starfield */
  var c=document.getElementById('stars'),x=c.getContext('2d'),stars=[],W,H,dpr=Math.min(devicePixelRatio||1,2);
  function size(){
    W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(W*H/9000);stars=[];
    for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,s:Math.random()*2+.5,o:Math.random()*6.28,d:Math.random()*.25+.05});
  }
  var mx=0,my=0;
  function draw(ts){
    x.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
      var s=stars[i],a=.35+.65*Math.abs(Math.sin(ts/1000*s.s*.5+s.o));
      x.globalAlpha=reduce?.7:a;
      x.fillStyle=i%9===0?'#ffd98a':'#cfdcff';
      x.beginPath();x.arc(s.x+mx*s.d*30,s.y+my*s.d*30,s.r,0,6.283);x.fill();
    }
    if(!reduce)requestAnimationFrame(draw);
  }
  size();addEventListener('resize',size);requestAnimationFrame(draw);

  /* mouse / touch parallax on the digits and stars */
  var dg=document.getElementById('digits');
  function move(e){
    var pt=e.touches?e.touches[0]:e;
    mx=(pt.clientX/W-.5)*2;my=(pt.clientY/H-.5)*2;
    if(!reduce){dg.style.setProperty('--px',(mx*14)+'px');dg.style.setProperty('--py',(my*10)+'px')}
  }
  addEventListener('mousemove',move,{passive:true});
  addEventListener('touchmove',move,{passive:true});

  /* an occasional shooting star */
  if(!reduce){
    var sh=document.getElementById('shoot');
    (function fire(){
      setTimeout(function(){
        sh.style.left=(W*.5+Math.random()*W*.5)+'px';
        sh.style.top=(Math.random()*H*.4)+'px';
        sh.classList.remove('go');void sh.offsetWidth;sh.classList.add('go');
        fire();
      },5000+Math.random()*5000);
    })();
  }
})();
</script>
</body>
</html>
