      hudLevelLabel = $("hudLevelLabel"), hudLevelValue = $("hudLevelValue"), hudLevelFill = $("hudLevelFill"),
      hudSeekBarFill = $("hudSeekBarFill");

const timeline = $("timeline"), tlBuf = $("tlBuf"), tlProg = $("tlProg"),
      tlThumb = $("tlThumb"), tlPreview = $("tlPreview");

const tCur = $("tCur"), tDur = $("tDur"), playIcon = $("playIcon"), fsIcon = $("fsIcon");
const lockLayer = $("lock"), unlockBtn = $("unlockBtn"), lockFlash = $("lockFlash");
const sheet = $("sheet"), sheetTitle = $("sheetTitle"), sheetNote = $("sheetNote"), sheetBody = $("sheetBody");
const notice = $("notice"), toastEl = $("toast");
const rippleL = $("rippleL"), rippleR = $("rippleR");
const btnNight = $("btnNight"), lblSpeed = $("lblSpeed"), lblQuality = $("lblQuality");


/* ============================================================================
 * 4. STATE
 * The video element stays the source of truth for currentTime, duration,
 * paused, ended, playbackRate, volume and muted. This object holds only what
 * the element cannot tell us.
 * ==========================================================================*/
const state = {
  locked:false, sheetOpen:false, noticeOpen:false, scrubbing:false,
  controlsOn:true, ready:false, switching:false, switchToken:0,
  quality:CONFIG.defaultQuality, activeSrc:"",
  speed:1, volume:1, brightness:1, night:false, fill:false,
  gesture:null, seekTarget:0,
  lastTapAt:0, lastTapX:0, resumeAt:0,
  spinnerBlockUntil:0
};


/* ============================================================================
 * 5. QUALITY MODEL — honest by construction
 * A quality exists only if CONFIG.sources holds a real URL. There is no
 * client-side downscaling anywhere in this file and none is implied.
 * ==========================================================================*/
function isUsableUrl(u){ return typeof u === "string" && /^https?:\/\/\S+/i.test(u.trim()); }
function availableQualities(){ return QUALITY_ORDER.filter(q => isUsableUrl(CONFIG.sources[q])); }

function resolveQualityKey(key){
  if (key === "auto"){ const a = availableQualities(); return a.length ? a[0] : null; }
  return isUsableUrl(CONFIG.sources[key]) ? key : null;
}
function resolveSrc(key){
  const real = resolveQualityKey(key);
  return real ? CONFIG.sources[real].trim() : "";
}

function sameUrl(a, b){
  if (!a || !b) return false;
  try { return new URL(a, location.href).href === new URL(b, location.href).href; }
  catch(e){ return a === b; }
}

function activeQualityKey(){
  for (const q of QUALITY_ORDER){
    const u = CONFIG.sources[q];
    if (isUsableUrl(u) && sameUrl(u.trim(), state.activeSrc)) return q;
  }
  return null;
}

const measuredMB = Object.create(null);
const measuring  = Object.create(null);

/* A size we know for certain: either you supplied it, or we read the real byte
   length off the wire (and cached it across sessions). */
function exactSizeMB(q){
  if (isNum(CONFIG.sizesMB[q]) && CONFIG.sizesMB[q] > 0) return CONFIG.sizesMB[q];
  if (isNum(measuredMB[q]) && measuredMB[q] > 0) return measuredMB[q];
  return null;
}

/* Any rendition whose true size we hold, used as the anchor for the others. */
function sizeAnchor(){
  for (let i = 0; i < QUALITY_ORDER.length; i++){
    const q = QUALITY_ORDER[i], mb = exactSizeMB(q);
    if (mb !== null) return { key:q, mb:mb };
  }
  return null;
}

/* Data usage for one rendition -> { mb, exact } or null.
   Order of preference: measured · scaled from a measured sibling · modelled
   from the real duration. Only the first is reported as fact. */
function sizeInfo(q){
  const exact = exactSizeMB(q);
  if (exact !== null) return { mb:exact, exact:true };

  const anchor = sizeAnchor();
  if (anchor && BITRATE_KBPS[q] && BITRATE_KBPS[anchor.key]){
    return { mb: anchor.mb * (BITRATE_KBPS[q] / BITRATE_KBPS[anchor.key]), exact:false };
  }

  const dur = video.duration;
  if (isNum(dur) && dur > 0 && BITRATE_KBPS[q]){
    /* kbps · seconds -> kilobits -> bytes -> MiB */
    return { mb: BITRATE_KBPS[q] * dur / 8388.608, exact:false };
  }
  return null;
}

/* The line under each quality in the sheet. Every rendition gets a number, and
   the wording always makes clear whether it is measured or estimated. */
function dataLine(q){
  const configured = isUsableUrl(CONFIG.sources[q]);
  const info = sizeInfo(q);

  if (!info) return configured ? "Size not known yet" : "Not added yet";
  const total = fmtMB(info.mb);

  if (!configured) return "Not added yet · about " + total + " estimated";
  if (!info.exact) return "About " + total + " estimated for the full movie";

  const dur = video.duration;
  if (isNum(dur) && dur > 0 && q === activeQualityKey()){
    const left = info.mb * (1 - clamp(video.currentTime / dur, 0, 1));
    if (left < info.mb * 0.98) return total + " total · about " + fmtMB(left) + " left from here";
  }
  return total + " for the full movie";
}

function autoDataLine(){
  const real = resolveQualityKey("auto");
  if (!real) return "No source configured";
  const info = sizeInfo(real);
  const suffix = info ? " · " + (info.exact ? "" : "about ") + fmtMB(info.mb) : "";
  return "Best available — currently " + real + suffix;
}

function refreshQualitySheet(){
  if (state.sheetOpen && sheet.dataset.kind === "quality") renderQualitySheet();
}

/* Measure the true byte length once per URL, then remember it forever.
   HEAD first; if the host blocks it or omits Content-Length, a one-byte Range
   request reads the total out of Content-Range. Either way the cost is a few
   hundred bytes, once, and never again on any later launch. */
function measureSize(key){
  if (!CONFIG.measureFileSize) return;
  const real = resolveQualityKey(key);
  if (!real || exactSizeMB(real) !== null || measuring[real]) return;

  const url = CONFIG.sources[real].trim();
  const cacheKey = "size:" + videoKey(url).slice(4);

  const cached = Store.get(cacheKey, null);
  if (isNum(cached) && cached > 0){ measuredMB[real] = cached; refreshQualitySheet(); return; }

  if (typeof fetch !== "function" || typeof AbortController !== "function") return;
  measuring[real] = true;

  function ask(init, read){
    const ctrl = new AbortController();
    const bail = setTimeout(() => ctrl.abort(), 6000);
    init.signal = ctrl.signal;
    return fetch(url, init)
      .then(res => { clearTimeout(bail); return res.ok || res.status === 206 ? read(res) : null; })
      .catch(() => { clearTimeout(bail); return null; });
  }

  ask({ method:"HEAD" }, res => {
    const len = parseInt(res.headers.get("content-length") || "", 10);
    return isNum(len) && len > 0 ? len / 1048576 : null;
  })
  .then(mb => mb || ask({ method:"GET", headers:{ Range:"bytes=0-0" } }, res => {
    const m = /\/\s*(\d+)\s*$/.exec(res.headers.get("content-range") || "");
    return m ? parseInt(m[1], 10) / 1048576 : null;
  }))
  .then(mb => {
    measuring[real] = false;
    if (isNum(mb) && mb > 0){
      measuredMB[real] = mb;
      Store.set(cacheKey, mb);
      refreshQualitySheet();
    }
  });
}

/* Measure every configured rendition we still don't know — but only when the
   user actually opens the quality sheet, never on load. */
function measureConfigured(){
  for (let i = 0; i < QUALITY_ORDER.length; i++){
    if (isUsableUrl(CONFIG.sources[QUALITY_ORDER[i]])) measureSize(QUALITY_ORDER[i]);
  }
}


/* ============================================================================
 * 6. SOURCE LOADING — one entry point, race-safe
 * ==========================================================================*/
let pendingCleanup = null;

function loadInitial(){
  const src = resolveSrc(state.quality);
  if (!src){
    showNotice("No video source configured", "Add your video URL to CONFIG.sources inside index.html.");
    return;
  }
  if (CONFIG.rememberPosition){
    const saved = Store.get(videoKey(src), 0);
    if (isNum(saved) && saved > CONFIG.minResumeSec) state.resumeAt = saved;
  }
  applySource(src, { time:state.resumeAt, play:CONFIG.autoplay, initial:true,
                     onReady(){ measureSize(state.quality); } });
}

/* The only place that ever assigns video.src */
function applySource(url, opts){
  opts = opts || {};
  if (pendingCleanup){ pendingCleanup(); pendingCleanup = null; }
  const token = ++state.switchToken;
  const previous = {
    src: state.activeSrc,
    quality: state.quality,
    time: isNum(opts.time) ? opts.time : 0,
    play: !!opts.play
  };

  state.switching = true;
  state.activeSrc = url;
  if (opts.initial) showLoading("Preparing playback");

  function cleanup(){
    video.removeEventListener("loadedmetadata", onMeta);
    video.removeEventListener("error", onErr);
    if (pendingCleanup === cleanup) pendingCleanup = null;
  }

  function onMeta(){
    if (token !== state.switchToken) return cleanup();
    cleanup();
    state.switching = false;
    showSpinner(false);

    const dur = video.duration;
    let t = isNum(opts.time) ? opts.time : 0;
    if (isNum(dur) && dur > 0) t = clamp(t, 0, Math.max(0, dur - 0.25));
    if (t > 0.5){ try { video.currentTime = t; } catch(e){} }

    /* video.load() resets the rate — restore everything the user chose */
    applySpeed(state.speed, true);
    video.volume = state.volume;
    video.muted = state.volume === 0;

    tDur.textContent = fmtTime(dur);
    timeline.setAttribute("aria-valuemax", isNum(dur) ? Math.floor(dur) : 0);
    hideNotice();
    /* The repaint caches hold values measured against the previous file. Clear
       them or a switch between two files of different length can skip the very
       write that would have corrected the bar. */
    lastProg = -1; lastBuf = ""; lastCur = "";
    measureTimeline();
    paint();

    if (opts.play) safePlay();
    if (typeof opts.onReady === "function") opts.onReady();
  }

  function onErr(){
    if (token !== state.switchToken) return cleanup();
    cleanup();
    state.switching = false;
    showSpinner(false);

    if (previous.src && !sameUrl(previous.src, url)){
      state.quality = previous.quality;
      syncQualityChip();
      toast("That quality failed. Staying on the previous one.");
      applySource(previous.src, { time:previous.time, play:previous.play });
    } else {
      reportMediaError();
    }
  }

  pendingCleanup = cleanup;
  video.addEventListener("loadedmetadata", onMeta);
  video.addEventListener("error", onErr);

  video.src = url;
  try { video.load(); } catch(e){}
  syncQualityChip();
}

function selectQuality(key){
  const target = resolveSrc(key);
  if (!target){ toast("That quality isn't available."); return; }

  const changed = !sameUrl(target, state.activeSrc);
  state.quality = key;
  Store.set("quality", key);
  syncQualityChip();

  if (!changed){
    /* The label moved; the stream did not. Don't claim otherwise. */
    if (key === "auto") toast("Auto · playing " + (resolveQualityKey(key) || "source"));
    return;
  }

  /* Position, play state, speed, volume, night mode and fit all survive:
     speed/volume are reapplied in onMeta, night/fit live in CSS. */
  showLoading("Switching quality");
  applySource(target, {
    time: video.currentTime,
    play: !video.paused && !video.ended,
    onReady(){ measureSize(key); toast("Now playing " + (resolveQualityKey(key) || key)); }
  });
}

function syncQualityChip(){
  lblQuality.textContent = state.quality === "auto" ? "Auto" : state.quality;
}


/* ============================================================================
 * 7. LOADING / READY STATE
 * Separate from the buffering spinner: this is the full black cinematic layer
 * that hides the WebView's own video chrome until a frame is decodable.
 * ==========================================================================*/
/* The preview card. With no CONFIG.poster it draws its own mark and costs
   nothing — no request, no decode, no bytes. With one, the image is fetched at
   low priority so it can never compete with the video for a scarce connection,
   and any failure silently leaves the built-in mark in place. */
function initPreview(){
  const url = (CONFIG.poster || "").trim();
  if (!url) return;
  const img = $("loadPoster"), card = $("loadCard");
  img.addEventListener("load", () => { img.classList.add("on"); card.classList.add("art"); }, { once:true });
  img.addEventListener("error", () => { img.removeAttribute("src"); }, { once:true });
  img.src = url;
}

function showLoading(msg){
  state.ready = false;
  $("loadMsg").textContent = msg || "Preparing playback";
  loading.classList.remove("gone");
  video.classList.remove("ready");
}

function markReady(ready){
  if (ready){
    if (state.ready) return;
    state.ready = true;
    video.classList.add("ready");
    loading.classList.add("gone");
  } else {
    state.ready = false;
    video.classList.remove("ready");
  }
}

/* Reveal on whichever "first frame is decodable" signal the platform gives us,
   with a metadata-based fallback for WebViews that never fire loadeddata. */
["loadeddata","canplay","playing"].forEach(ev => video.addEventListener(ev, () => markReady(true)));
video.addEventListener("loadedmetadata", () => Timers.set("readyFallback", () => markReady(true), 1400));


/* ============================================================================
 * 8. PLAYBACK
 * ==========================================================================*/
function safePlay(){
  const p = video.play();
  if (p && typeof p.catch === "function"){
    p.catch(err => {
      if (err && err.name === "NotAllowedError") showControls(true);
      console.warn("play() rejected:", err && err.name);
    });
  }
}

function togglePlay(){
  if (video.paused || video.ended) safePlay(); else video.pause();
}

/* --------------------------------------------------------------------------
 * SKIP — deterministic. It moves currentTime and nothing else: it never calls
 * play() or pause(), so a playing movie keeps playing and a paused one stays
 * paused. It also suppresses the buffering spinner briefly, which is what used
 * to make the centre overlay flicker on every tap.
 * ------------------------------------------------------------------------*/
function skip(seconds){
  const dur = video.duration;
  if (!isNum(dur) || dur <= 0) return;

  state.spinnerBlockUntil = Date.now() + CONFIG.skipSpinnerGrace;
  showSpinner(false);

  const to = clamp(video.currentTime + seconds, 0, Math.max(0, dur - 0.05));
  try { video.currentTime = to; } catch(e){ return; }

  syncPlayIcon();                       // clears a stale replay icon after ended
  showSeekHud(seconds, to);
  fadeHud(600);
  queuePaint();
}

function syncPlayIcon(){
  const href = video.ended ? "#i-replay" : (video.paused ? "#i-play" : "#i-pause");
  playIcon.firstElementChild.setAttribute("href", href);
  $("btnPlay").setAttribute("aria-label", video.paused ? "Play" : "Pause");
}

/* Speed changes never reload, never seek, never pause */
function applySpeed(rate, silent){
  const wanted = clamp(Number(rate) || 1, SPEED_MIN, SPEED_MAX);
  try { video.playbackRate = wanted; } catch(e){}
  const actual = isNum(video.playbackRate) ? video.playbackRate : 1;
  state.speed = actual;
  lblSpeed.textContent = fmtSpeed(actual);
  Store.set("speed", actual);
  if (!silent && Math.abs(actual - wanted) > 0.02) toast("This device kept playback at " + fmtSpeed(actual));
}


/* ============================================================================
 * 9. TIMELINE
 * ==========================================================================*/
let paintQueued = false;

/* The track geometry is read once and reused, rather than on every frame of a
   scrub. getBoundingClientRect() forces a synchronous layout, and calling it
   inside a pointermove handler is the classic way to make a drag feel sticky
   on a mid-range Android device. */
let tlLeft = 0, tlW = 0;
function measureTimeline(){
  const r = timeline.getBoundingClientRect();
  tlLeft = r.left; tlW = r.width;
}

/* Last values written, so a repaint that changes nothing touches no DOM. */
let lastProg = -1, lastBuf = "", lastCur = "";

function paint(){
  paintQueued = false;
  const dur = video.duration;
  if (!isNum(dur) || dur <= 0) return;
  if (tlW <= 0) measureTimeline();

  if (!state.scrubbing){
    const p = clamp(video.currentTime / dur, 0, 1);
    if (p !== lastProg){
      lastProg = p;
      tlProg.style.transform = "scaleX(" + p + ")";
      tlThumb.style.transform = "translate3d(" + (p * tlW).toFixed(1) + "px,0,0)";
    }
    const cur = fmtTime(video.currentTime);
    if (cur !== lastCur){
      lastCur = cur;
      tCur.textContent = cur;
      timeline.setAttribute("aria-valuenow", Math.floor(video.currentTime));
    }
  }

  /* Buffered range, YouTube style: the soft white band shows the span that is
     actually downloaded AROUND the playhead — not a bar that always starts at
     zero. After a seek into fresh territory the browser buffers, say, 1:20:00
     to 1:20:40; painting 0 to 1:20:40 as "loaded" would have been a lie. */
  let bs = 0, be = 0;
  try{
    const b = video.buffered, t = video.currentTime;
    for (let i = 0; i < b.length; i++){
      const s = b.start(i), e = b.end(i);
      if (s <= t + 0.25 && e >= t - 0.25){ bs = s; be = e; break; }
    }
    if (be <= bs && b.length){ bs = b.start(b.length - 1); be = b.end(b.length - 1); }
  }catch(e){}

  const b0 = clamp(bs / dur, 0, 1), b1 = clamp(be / dur, 0, 1);
  const bufCss = "translateX(" + (b0 * 100).toFixed(2) + "%) scaleX(" + Math.max(0, b1 - b0).toFixed(4) + ")";
  if (bufCss !== lastBuf){ lastBuf = bufCss; tlBuf.style.transform = bufCss; }
}

function queuePaint(){ if (!paintQueued){ paintQueued = true; requestAnimationFrame(paint); } }

function ratioAt(clientX){
  return tlW <= 0 ? 0 : clamp((clientX - tlLeft) / tlW, 0, 1);
}

function drawScrub(ratio){
  tlProg.style.transform = "scaleX(" + ratio + ")";
  tlThumb.style.transform = "translate3d(" + (ratio * tlW).toFixed(1) + "px,0,0)";
  lastProg = -1;
  const t = ratio * (video.duration || 0);
  lastCur = fmtTime(t);            // cache mirrors what is actually on screen
  tCur.textContent = lastCur;
  tlPreview.textContent = lastCur;
  tlPreview.style.transform =
    "translate3d(" + clamp(ratio * tlW, tlW * 0.08, tlW * 0.92).toFixed(1) + "px,0,0) translateX(-50%)";
}

let scrubRatio = 0, scrubQueued = false;

timeline.addEventListener("pointerdown", e => {
  if (state.locked || !isNum(video.duration) || video.duration <= 0) return;
  measureTimeline();
  state.scrubbing = true;
  timeline.classList.add("scrub");
  try { timeline.setPointerCapture(e.pointerId); } catch(err){}
  scrubRatio = ratioAt(e.clientX);
  drawScrub(scrubRatio);
  Timers.clear("hideControls");
});

timeline.addEventListener("pointermove", e => {
  if (!state.scrubbing) return;
  scrubRatio = ratioAt(e.clientX);
  if (!scrubQueued){
    scrubQueued = true;
    requestAnimationFrame(() => { scrubQueued = false; drawScrub(scrubRatio); });
  }
});

function endScrub(){
  if (!state.scrubbing) return;
  state.scrubbing = false;
  timeline.classList.remove("scrub");
  const dur = video.duration;
  if (isNum(dur) && dur > 0){
    state.spinnerBlockUntil = Date.now() + CONFIG.skipSpinnerGrace;
    try { video.currentTime = clamp(scrubRatio * dur, 0, dur - 0.05); } catch(e){}
  }
  scheduleHide();
}
timeline.addEventListener("pointerup", endScrub);
timeline.addEventListener("pointercancel", endScrub);
timeline.addEventListener("lostpointercapture", endScrub);


/* ============================================================================
 * 10. CONTROLS VISIBILITY
 * ==========================================================================*/
/* Single writer for "are the controls on screen". The `ctl` class on the stage
   is what lifts the spinner, both HUDs, the lock flash and the toast clear of
   the transport row, so it must never be set anywhere else — one forgotten
   toggle and the centred layers collide with the play button again. */
function setControls(on){
  state.controlsOn = on;
  controls.classList.toggle("on", on);
  stage.classList.toggle("ctl", on);
  /* Cheapest possible place to keep the cached track geometry honest: the
     timeline only matters while it is on screen, and WebView insets can change
     without ever firing a resize. */
  if (on) measureTimeline();
}

function showControls(sticky){
  if (state.locked) return;
  setControls(true);
  Timers.clear("hideControls");
  if (!sticky) scheduleHide();
}

function hideControls(){
  if (state.scrubbing || state.sheetOpen || state.noticeOpen) return;
  setControls(false);
}

function scheduleHide(){
  Timers.clear("hideControls");
  if (video.paused || state.sheetOpen || state.scrubbing || state.noticeOpen) return;
  Timers.set("hideControls", hideControls, CONFIG.controlsTimeout);
}

function toggleControls(){ state.controlsOn ? hideControls() : showControls(); }


/* ============================================================================
 * 11. GESTURES
 *   horizontal -> dynamic seek, live HUD, committed on release
 *   vertical L -> brightness      vertical R -> volume
 *   tap -> controls               double tap -> ±10s / play-pause
 * ==========================================================================*/
const G = { live:false, id:null, x0:0, y0:0, t0:0, axis:null, zone:null, left:false,
            base:0, startTime:0, delta:0, target:0, moved:false };

/* touchmove can fire several times per frame on a 120Hz panel. Everything the
   gesture wants to draw is parked here and flushed once per frame instead, so
   a long drag writes to the DOM 60 times a second, not 300. */
const GFrame = { queued:false, seek:false, level:null };

function flushGesture(){
  GFrame.queued = false;
  if (GFrame.seek){ GFrame.seek = false; showSeekHud(G.delta, G.target); }
  if (GFrame.level){
    const L = GFrame.level; GFrame.level = null;
    if (L.zone === "volume") setVolume(L.v, true); else setBrightness(L.v, true);
  }
}
function queueGesture(){
  if (!GFrame.queued){ GFrame.queued = true; requestAnimationFrame(flushGesture); }
}

function gesturesAllowed(){
  return !state.locked && !state.scrubbing && !state.sheetOpen && !state.noticeOpen && state.ready;
}

/* --------------------------------------------------------------------------
 * DYNAMIC SWIPE SEEKING — MX Player style
 *
 * The screen is split into two functional blocks and the block your finger
 * LANDS in picks the profile for that whole gesture; the direction you then
 * drag picks the sign, which is what makes it feel physical rather than modal:
 *
 *   Left block   fine profile   ~1s per 15px, 10s at 42% of the width,
 *                               easing out to 60s at full travel.
 *   Right block  wide profile   ~1s per 9px near the origin, then ramping
 *                               hard to 5 minutes at full travel.
 *
 * Within a profile the curve is linear through the fine zone — so the first
 * part of every swipe still steps in single seconds, exactly as before — and
 * then picks up a power curve past it. That is the "transition after the
 * block's maximum range": precision where your thumb starts, reach where it
 * ends, with no cliff between the two.
 *
 * Measured on a 400px-wide phone at negligible flick speed. Right block,
 * dragging right (forward):
 *   10px 1s · 50px 5s · 96px 10s · 200px 37s · 320px 2:38 · 400px 5:00
 * Left block, dragging left (backward):
 *   15px 1s · 84px 5s · 168px 10s · 300px 24s · 400px 1:00
 * A fast flick scales those by up to +45%.
 *
 * Nothing is committed until you lift your finger, so a long exploratory drag
 * costs no bandwidth at all — only the final position is ever fetched.
 * ------------------------------------------------------------------------*/
function seekFromSwipe(dx, elapsedMs, fromLeftBlock){
  const S = CONFIG.swipe;
  const w = Math.max(1, window.innerWidth);
  const frac = Math.min(Math.abs(dx) / w, 1);

  const fine = fromLeftBlock ? S.leftFine : S.rightFine;
  const max  = fromLeftBlock ? S.leftMax  : S.rightMax;

  let secs;
  if (frac <= fine){
    secs = frac / fine * S.fineSecs;                      // single-second control
  } else {
    const past = (frac - fine) / (1 - fine);              // 0 -> 1 beyond the zone
    secs = S.fineSecs + Math.pow(past, S.curve) * (max - S.fineSecs);
  }

  /* A quick flick reaches further than a slow drag of the same length. */
  const vel = Math.abs(dx) / Math.max(16, elapsedMs);     // px per ms
  secs *= 1 + clamp(vel / S.velocityRef, 0, 1) * S.velocityBoost;

  secs = Math.min(secs, max * (1 + S.velocityBoost));
  if (secs < 1) secs = 1;                                 // smallest useful step
  return Math.round(secs) * (dx < 0 ? -1 : 1);
}

gestures.addEventListener("touchstart", e => {
  if (!gesturesAllowed() || e.touches.length > 1){ G.live = false; return; }
  const t = e.touches[0], w = window.innerWidth;
  if (t.clientX < w * CONFIG.edgeGuard || t.clientX > w * (1 - CONFIG.edgeGuard)){ G.live = false; return; }

  G.live = true; G.id = t.identifier;
  G.x0 = t.clientX; G.y0 = t.clientY; G.t0 = Date.now();
  G.axis = null; G.moved = false; G.delta = 0;
  G.startTime = video.currentTime;

  /* One split, read once, driving both axes: the left block is fine seeking
     and brightness, the right block is wide seeking and volume. */
  G.left = t.clientX < w / 2;
  G.zone = G.left ? "brightness" : "volume";
}, { passive:true });

gestures.addEventListener("touchmove", e => {
  if (!G.live) return;
  const t = e.touches[0];
  if (!t || t.identifier !== G.id) return;

  const dx = t.clientX - G.x0, dy = t.clientY - G.y0;

  if (!G.axis){
    if (Math.abs(dx) < CONFIG.deadzone && Math.abs(dy) < CONFIG.deadzone) return;
    G.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";   // locked for the whole gesture
    G.moved = true;
    G.base = G.zone === "volume" ? state.volume : state.brightness;
    state.gesture = G.axis;
    if (G.axis === "y" && G.zone === "brightness") dimEl.classList.add("live");
    hideControls();
  }

  /* Own the touch only once the axis is known, so taps and system edge
     swipes keep their native behaviour. */
  if (e.cancelable) e.preventDefault();

  if (G.axis === "x"){
    const dur = video.duration;
    if (!isNum(dur) || dur <= 0) return;
    const d = seekFromSwipe(dx, Date.now() - G.t0, G.left);
    if (d !== G.delta){
      G.delta = d;
      G.target = clamp(G.startTime + d, 0, dur - 0.05);
      state.seekTarget = G.target;
      GFrame.seek = true;                // live feedback, coalesced to one frame
      queueGesture();
    }
  } else {
    const span = window.innerHeight * CONFIG.verticalTravel;
    GFrame.level = { zone:G.zone, v:clamp(G.base - (dy / span), 0, 1) };
    queueGesture();
  }
}, { passive:false });

function endGesture(e){
  if (!G.live) return;
  G.live = false;
  state.gesture = null;
  if (GFrame.queued) flushGesture();          // never lose the last frame
  dimEl.classList.remove("live");

  if (G.axis === "x"){
    /* The one and only seek of the whole gesture. Everything before this was
       drawn on screen and cost nothing on the network. */
    if (G.delta !== 0 && isNum(video.duration)){
      state.spinnerBlockUntil = Date.now() + CONFIG.skipSpinnerGrace;
      try { video.currentTime = G.target; } catch(err){}
      queuePaint();
    }
    fadeHud(420);
  } else if (G.axis === "y"){
    fadeHud(520);
  } else if (!G.moved && e && e.changedTouches && e.changedTouches.length){
    handleTap(e.changedTouches[0]);
  }
  G.axis = null;
}
gestures.addEventListener("touchend", endGesture, { passive:true });
gestures.addEventListener("touchcancel", () => {
  G.live = false; G.axis = null; state.gesture = null;
  GFrame.seek = false; GFrame.level = null;
  dimEl.classList.remove("live");
}, { passive:true });

/* Mouse fallback only — touch devices emit a synthetic click after touchend,
   which would double-toggle the controls. */
let sawTouch = false;
gestures.addEventListener("touchstart", () => { sawTouch = true; }, { passive:true, capture:true });
gestures.addEventListener("click", () => { if (!sawTouch && gesturesAllowed()) toggleControls(); });

/* Double tap stays a fixed ±10s — it is a separate interaction from the swipe */
function handleTap(touch){
  const x = touch.clientX, w = window.innerWidth, now = Date.now();
  const isDouble = (now - state.lastTapAt) < CONFIG.doubleTapMs && Math.abs(x - state.lastTapX) < 70;

  if (isDouble){
    Timers.clear("singleTap");
    state.lastTapAt = 0;
    if (x < w * 0.35){ skip(-CONFIG.seekStep); flashRipple(rippleL); tick(10); }
    else if (x > w * 0.65){ skip(CONFIG.seekStep); flashRipple(rippleR); tick(10); }
    else togglePlay();
    return;
  }

  state.lastTapAt = now;
  state.lastTapX = x;
  Timers.set("singleTap", toggleControls, CONFIG.doubleTapMs);
}

function flashRipple(el){
  el.classList.remove("go");
  void el.offsetWidth;
  el.classList.add("go");
}

/* A short tick on discrete actions, the way a native player feels. Does nothing
   at all if the host app has no VIBRATE permission, so it can never fail. */
function tick(ms){
  if (!CONFIG.haptics || typeof navigator.vibrate !== "function") return;
  try { navigator.vibrate(ms); } catch(e){}
}


/* ============================================================================
 * 12. VOLUME / BRIGHTNESS / NIGHT MODE
 * ==========================================================================*/

/* Optional native bridge. Never required, never throws. */
function bridgeBrightness(v){
  const b = window.AndroidBridge;
  if (b && typeof b.setBrightness === "function"){
    try { b.setBrightness(clamp(v, 0, 1)); return true; } catch(e){}
  }
  return false;
}

/* One overlay carries both effects, composited so they never double-darken */
function applyDim(){
  const fromBrightness = (1 - state.brightness) * CONFIG.maxDim;
  const fromNight = state.night ? CONFIG.nightLevel : 0;
  const combined = 1 - (1 - fromBrightness) * (1 - fromNight);
  dimEl.style.opacity = Math.min(combined, 0.88).toFixed(3);
}

function setVolume(v, withHud){
  state.volume = clamp(v, 0, 1);
  video.volume = state.volume;
  video.muted = state.volume === 0;
  Store.set("volume", state.volume);
  if (withHud) showLevelHud(state.volume === 0 ? "#i-mute" : "#i-vol", "Volume", state.volume);
}

function setBrightness(b, withHud){
  state.brightness = clamp(b, 0, 1);
  applyDim();
  Store.set("brightness", state.brightness);
  /* Ask the host app for real screen brightness when it offers the hook:
       class Bridge(private val a: Activity) {
         @JavascriptInterface fun setBrightness(v: Float) {
           a.runOnUiThread {
             val lp = a.window.attributes
             lp.screenBrightness = v.coerceIn(0.01f, 1f)
             a.window.attributes = lp
           }
         }
         @JavascriptInterface fun close() { a.finish() }
       }
       webView.addJavascriptInterface(Bridge(this), "AndroidBridge")            */
  bridgeBrightness(state.night ? Math.min(state.brightness, CONFIG.nightBridgeBrightness) : state.brightness);
  if (withHud) showLevelHud("#i-bright", "Brightness", state.brightness);
}

function setNight(on, announce){
  state.night = !!on;
  applyDim();
  Store.set("night", state.night);

  btnNight.classList.toggle("active", state.night);
  btnNight.setAttribute("aria-pressed", state.night ? "true" : "false");
  btnNight.setAttribute("aria-label", state.night ? "Night mode on" : "Night mode off");

  /* Layer 2: request a dimmer screen if the bridge exists, restore when off.
     The CSS layer above already did the real work either way. */
  bridgeBrightness(state.night ? Math.min(state.brightness, CONFIG.nightBridgeBrightness) : state.brightness);

  if (announce) toast(state.night ? "Night mode on" : "Night mode off");
}


/* ============================================================================
 * 13. HUDs + TOAST
 * ==========================================================================*/
function showSeekHud(delta, target){
  hudLevel.classList.remove("on");
  hudSeekIcon.firstElementChild.setAttribute("href", delta < 0 ? "#i-rew" : "#i-ff");
  hudSeekNum.textContent = (delta >= 0 ? "+" : "\u2212") + fmtDelta(delta);
  const dur = video.duration || 0;
  hudSeekTime.textContent = fmtTime(target) + " / " + fmtTime(dur);
  hudSeekBarFill.style.transform = "scaleX(" + (dur > 0 ? clamp(target / dur, 0, 1) : 0) + ")";
  hudSeek.classList.add("on");
  Timers.clear("hud");
}

function showLevelHud(iconId, label, value){
  hudSeek.classList.remove("on");
  hudLevelIcon.firstElementChild.setAttribute("href", iconId);
  hudLevelLabel.textContent = label;
  hudLevelValue.textContent = Math.round(value * 100) + "%";
  hudLevelFill.style.transform = "scaleX(" + value + ")";
  hudLevel.classList.add("on");
  Timers.clear("hud");
}

function fadeHud(ms){
  Timers.set("hud", () => { hudSeek.classList.remove("on"); hudLevel.classList.remove("on"); }, ms);
}

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  Timers.set("toast", () => toastEl.classList.remove("on"), 1700);
}


/* ============================================================================
 * 14. BUFFERING SPINNER
 * ==========================================================================*/
function showSpinner(on){
  if (on){
    if (Date.now() < state.spinnerBlockUntil) return;     // right after a skip
    if (!state.ready) return;                             // loading layer owns it
    if (!Timers.has("spinner") && !spinner.classList.contains("on")){
      Timers.set("spinner", () => spinner.classList.add("on"), CONFIG.spinnerDelay);
    }
  } else {
    Timers.clear("spinner");
    spinner.classList.remove("on");
  }
}


/* ============================================================================
 * 15. LOCK MODE
 * ==========================================================================*/
function lockScreen(){
  if (state.locked) return;
  state.locked = true;

  closeSheet(true);
  Timers.clear("hideControls");
  Timers.clear("singleTap");
  Timers.clear("toast");
  setControls(false);
  hudSeek.classList.remove("on");
  hudLevel.classList.remove("on");
  toastEl.classList.remove("on");

  lockLayer.classList.add("on");
  unlockBtn.classList.remove("on");
  Timers.clear("unlockHide");
  tick(14);
  flashLock("Screen locked", "#i-lock");
}

function unlockScreen(){
  if (!state.locked) return;
  state.locked = false;
  lockLayer.classList.remove("on");
  unlockBtn.classList.remove("on");
  Timers.clear("unlockHide");
  Timers.clear("lockFlash");
  lockFlash.classList.remove("go");
  tick(10);
  /* Controls first, flash second. The flash keyframes read --fy live, so
     starting the animation before the stage gains `ctl` would make the pill
     jump upward mid-flight. */
  showControls();
  flashLock("Unlocked", "#i-unlock");
}

function flashLock(text, icon){
  $("lockFlashText").textContent = text;
  lockFlash.firstElementChild.setAttribute("href", icon);
  lockFlash.classList.remove("go");
  void lockFlash.offsetWidth;
  lockFlash.classList.add("go");
  Timers.set("lockFlash", () => lockFlash.classList.remove("go"), 1400);
}

function revealUnlock(){
  unlockBtn.classList.add("on");
  Timers.set("unlockHide", () => unlockBtn.classList.remove("on"), 2600);
}

lockLayer.addEventListener("touchstart", e => {
  if (unlockBtn.contains(e.target)) return;
  if (e.cancelable) e.preventDefault();
  revealUnlock();
}, { passive:false });
lockLayer.addEventListener("touchmove", e => { if (e.cancelable) e.preventDefault(); }, { passive:false });
lockLayer.addEventListener("click", e => { if (!unlockBtn.contains(e.target)) revealUnlock(); });
unlockBtn.addEventListener("click", e => { e.stopPropagation(); unlockScreen(); });


/* ============================================================================
 * 16. FULLSCREEN
 * The web layer does what it can and fails quietly; the native app will own
 * immersive mode, the status bar and forced orientation later.
 * ==========================================================================*/
function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }

function enterFullscreen(){
  const el = stage;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req){ toast("Fullscreen isn't supported here."); return; }
  let p;
  try { p = req.call(el, { navigationUI:"hide" }); }
  catch(e){ try { p = req.call(el); } catch(e2){ p = null; } }
  Promise.resolve(p)
    .then(lockLandscape)
    .catch(err => { console.warn("fullscreen:", err && err.name); return lockLandscape(); })
    .then(syncFsIcon, syncFsIcon);
}

function lockLandscape(){
  try{
    if (screen.orientation && typeof screen.orientation.lock === "function"){
      return Promise.resolve(screen.orientation.lock("landscape")).catch(() => {});
    }
  }catch(e){}
  return Promise.resolve();
}

function exitFullscreen(){
  try{ if (screen.orientation && typeof screen.orientation.unlock === "function") screen.orientation.unlock(); }catch(e){}
  const ex = document.exitFullscreen || document.webkitExitFullscreen;
  if (!ex) return;
  try { Promise.resolve(ex.call(document)).catch(() => {}); } catch(e){}
}

function toggleFullscreen(){ fsElement() ? exitFullscreen() : enterFullscreen(); }

function syncFsIcon(){
  const on = !!fsElement();
  fsIcon.firstElementChild.setAttribute("href", on ? "#i-fsx" : "#i-fs");
  $("btnFs").setAttribute("aria-label", on ? "Exit fullscreen" : "Enter fullscreen");
}
document.addEventListener("fullscreenchange", syncFsIcon);
document.addEventListener("webkitfullscreenchange", syncFsIcon);


/* ============================================================================
 * 17. BOTTOM SHEET
 * ==========================================================================*/
function openSheet(kind, title, note, build){
  sheet.dataset.kind = kind;
  sheetTitle.textContent = title;
  if (note){ sheetNote.textContent = note; sheetNote.hidden = false; } else sheetNote.hidden = true;
  sheetBody.innerHTML = "";
  build(sheetBody);
  state.sheetOpen = true;
  sheet.classList.add("on");
  Timers.clear("hideControls");
  showControls(true);
}

function closeSheet(silent){
  if (!state.sheetOpen) return;
  state.sheetOpen = false;
  sheet.classList.remove("on");
  sheetBody.innerHTML = "";
  delete sheet.dataset.kind;
  if (!silent) scheduleHide();
}

function optionRow(o){
  const btn = document.createElement("button");
  btn.className = "opt" + (o.selected ? " sel" : "") + (o.disabled ? " off" : "");
  if (o.disabled) btn.setAttribute("aria-disabled", "true");

  const wrap = document.createElement("div");
  wrap.className = "opt-t";
  const l = document.createElement("div");
  l.className = "opt-l"; l.textContent = o.label;
  wrap.appendChild(l);
  if (o.meta){
    const m = document.createElement("div");
    m.className = "opt-m"; m.textContent = o.meta;
    wrap.appendChild(m);
  }

  const tick = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  tick.setAttribute("class", "opt-tick");
  tick.setAttribute("viewBox", "0 0 24 24");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#i-tick");
  tick.appendChild(use);

  btn.appendChild(wrap); btn.appendChild(tick);
  if (!o.disabled && o.onPick) btn.addEventListener("click", o.onPick);
  return btn;
}

$("sheetClose").addEventListener("click", () => closeSheet());
$("sheetBack").addEventListener("click", () => closeSheet());

/* ---- Speed -------------------------------------------------------------- */
function renderSpeedSheet(){
  openSheet("speed", "Playback speed", null, body => {
    SPEED_PRESETS.forEach(s => body.appendChild(optionRow({
      label: s === 1 ? "Normal (1x)" : s + "x",
      selected: Math.abs(state.speed - s) < 0.005,
      onPick(){ applySpeed(s); closeSheet(); }
    })));
    const custom = !SPEED_PRESETS.some(s => Math.abs(state.speed - s) < 0.005);
    body.appendChild(optionRow({
      label: "Custom",
      meta: custom ? "Currently " + fmtSpeed(state.speed) : "Any speed from 0.50x to 2.00x",
      selected: custom,
      onPick: renderCustomSpeedSheet
    }));
  });
}

/* Preview then apply: dragging the slider does not touch playbackRate */
function renderCustomSpeedSheet(){
  openSheet("customSpeed", "Custom speed", null, body => {
    const start = clamp(state.speed, SPEED_MIN, SPEED_MAX);

    const wrap = document.createElement("div");
    wrap.className = "speedwrap";

    const val = document.createElement("div");
    val.className = "speedval tnum";
    val.textContent = start.toFixed(2) + "x";

    const slider = document.createElement("input");
    slider.type = "range"; slider.className = "speedslider";
    slider.min = String(SPEED_MIN); slider.max = String(SPEED_MAX); slider.step = "0.01";
    slider.value = String(start);
    slider.setAttribute("aria-label", "Playback speed");

    const ends = document.createElement("div");
    ends.className = "speedends";
    ends.innerHTML = "<span>0.50x</span><span>2.00x</span>";

    const ticks = document.createElement("div");
    ticks.className = "speedticks";
    [0.75, 1, 1.25, 1.5, 1.75].forEach(v => {
      const b = document.createElement("button");
      b.className = "tick"; b.textContent = v.toFixed(2) + "x";
      b.addEventListener("click", () => { slider.value = String(v); update(); });
      ticks.appendChild(b);
    });

    function update(){ val.textContent = Number(slider.value).toFixed(2) + "x"; }
    slider.addEventListener("input", update);

    const row = document.createElement("div");
    row.className = "srow";
    const cancel = document.createElement("button");
    cancel.className = "btn ghost"; cancel.textContent = "Cancel";
    cancel.addEventListener("click", renderSpeedSheet);
    const apply = document.createElement("button");
    apply.className = "btn primary"; apply.textContent = "Apply";
    apply.addEventListener("click", () => {
      applySpeed(Number(slider.value));
      closeSheet();
      toast("Speed " + fmtSpeed(state.speed));
    });
    row.appendChild(cancel); row.appendChild(apply);

    wrap.appendChild(val); wrap.appendChild(slider);
    wrap.appendChild(ends); wrap.appendChild(ticks);
    body.appendChild(wrap); body.appendChild(row);
  });
}

/* ---- Quality ------------------------------------------------------------ */
function renderQualitySheet(){
  /* Opening the sheet is the signal that the numbers are actually wanted, so
     this is where any unmeasured file gets its one lookup. Results are cached
     across sessions, so in practice this fires once in the app's lifetime. */
  measureConfigured();

  const avail = availableQualities();
  const anchor = sizeAnchor();
  const note = avail.length <= 1
    ? "Only one encoded file is configured, so there is nothing to switch between yet. Add 720p, 480p or 360p URLs to CONFIG.sources and they appear here automatically."
    : "Switching loads a different file and keeps your position, speed and volume.";
  const sizeNote = anchor
    ? " Sizes are measured from the " + anchor.key + " file; the rest are scaled estimates."
    : " Sizes are estimated from the running time.";

  openSheet("quality", "Video quality", note + sizeNote, body => {
    body.appendChild(optionRow({
      label: "Auto",
      meta: autoDataLine(),
      selected: state.quality === "auto",
      disabled: !resolveQualityKey("auto"),
      onPick(){ selectQuality("auto"); closeSheet(); }
    }));
    QUALITY_ORDER.forEach(q => {
      const ok = isUsableUrl(CONFIG.sources[q]);
      body.appendChild(optionRow({
        label: q,
        meta: dataLine(q),            // every rendition carries a data figure
        selected: state.quality === q,
        disabled: !ok,
        onPick(){ selectQuality(q); closeSheet(); }
      }));
    });
  });
}


/* ============================================================================
 * 18. NOTICE / ERRORS
 * ==========================================================================*/
function showNotice(title, text){
  closeSheet(true);
  state.noticeOpen = true;
  loading.classList.add("gone");
  $("noticeTitle").textContent = title;
  $("noticeText").textContent = text;
  notice.classList.add("on");
  showControls(true);
}

function hideNotice(){
  state.noticeOpen = false;
  notice.classList.remove("on");
}

/* Plain language for the user, detail for the console */
function reportMediaError(){
  showSpinner(false);
  const err = video.error;
  const code = err ? err.code : 0;
  console.warn("media error", code, err && err.message);

  let text = "Please check your connection and try again.";
  if (!navigator.onLine) text = "You appear to be offline. Reconnect and try again.";
  else if (code === 2) text = "The connection dropped while loading. Check your network and try again.";
  else if (code === 3) text = "This file couldn't be decoded on this device.";
  else if (code === 4) text = "This video can't be played here.";

  showNotice("Unable to play this video", text);
}

$("noticeBtn").addEventListener("click", () => {
  hideNotice();
  const src = resolveSrc(state.quality) || state.activeSrc;
  if (!src){ showNotice("No video source configured", "Add your video URL to CONFIG.sources."); return; }
  const at = video.currentTime || state.resumeAt;
  state.activeSrc = "";
  markReady(false);
  applySource(src, { time:at, play:true, initial:true });   // one listener pair, always
});


/* ============================================================================
 * 19. VIDEO EVENTS
 * ==========================================================================*/
video.addEventListener("timeupdate", () => { queuePaint(); savePositionThrottled(); });
video.addEventListener("progress", queuePaint);
video.addEventListener("durationchange", () => { tDur.textContent = fmtTime(video.duration); queuePaint(); });

video.addEventListener("play",  () => { syncPlayIcon(); scheduleHide(); });
video.addEventListener("pause", () => { syncPlayIcon(); savePosition(); showControls(true); });
video.addEventListener("ended", () => { syncPlayIcon(); showControls(true); clearPosition(); });

const spinOn  = () => showSpinner(true);
const spinOff = () => showSpinner(false);
["waiting","stalled"].forEach(ev => video.addEventListener(ev, spinOn));
["playing","canplay","canplaythrough","loadeddata"].forEach(ev => video.addEventListener(ev, spinOff));

/* A seek only earns a spinner if it genuinely drags on */
video.addEventListener("seeking", () => { Timers.set("seekSpin", () => showSpinner(true), 700); });
video.addEventListener("seeked", () => {
  Timers.clear("seekSpin");
  showSpinner(false);
  syncPlayIcon();
  queuePaint();
});

video.addEventListener("ratechange", () => {
  if (isNum(video.playbackRate) && Math.abs(video.playbackRate - state.speed) > 0.005){
    state.speed = video.playbackRate;
    lblSpeed.textContent = fmtSpeed(state.speed);
  }
});
video.addEventListener("volumechange", () => { state.volume = video.volume; });
video.addEventListener("error", () => { if (!state.switching) reportMediaError(); });


/* ============================================================================
 * 20. POSITION MEMORY
 * ==========================================================================*/
let lastSave = 0;

function savePosition(){
  if (!CONFIG.rememberPosition || !state.activeSrc) return;
  const t = video.currentTime, dur = video.duration;
  if (!isNum(t) || !isNum(dur) || dur <= 0) return;
  if (t < CONFIG.minResumeSec || t > dur - CONFIG.endGuardSec){ clearPosition(); return; }
  Store.set(videoKey(state.activeSrc), Math.floor(t));
  lastSave = Date.now();
}
function savePositionThrottled(){ if (Date.now() - lastSave > 5000) savePosition(); }
function clearPosition(){ if (state.activeSrc) Store.set(videoKey(state.activeSrc), 0); }


/* ============================================================================
 * 21. BUTTONS — one responsibility each
 * ==========================================================================*/
$("btnPlay").addEventListener("click", () => { togglePlay(); showControls(); });
$("btnBack10").addEventListener("click", () => { skip(-CONFIG.seekStep); showControls(); });
$("btnFwd10").addEventListener("click", () => { skip(CONFIG.seekStep); showControls(); });
$("btnLock").addEventListener("click", lockScreen);
$("btnFs").addEventListener("click", () => { toggleFullscreen(); showControls(); });
$("btnSpeed").addEventListener("click", renderSpeedSheet);
$("btnQuality").addEventListener("click", renderQualitySheet);
btnNight.addEventListener("click", () => { setNight(!state.night, true); showControls(); });

$("btnZoom").addEventListener("click", () => {
  state.fill = !state.fill;
  video.classList.toggle("fill", state.fill);
  Store.set("fill", state.fill);
  toast(state.fill ? "Zoom to fill" : "Fit to screen");
  showControls();
});

function goBack(){
  if (state.sheetOpen){ closeSheet(); return; }
  if (state.noticeOpen){ hideNotice(); return; }
  if (fsElement()){ exitFullscreen(); return; }
  if (state.locked){ unlockScreen(); return; }
  savePosition();
  const b = window.AndroidBridge;
  if (b && typeof b.close === "function"){ try { b.close(); return; } catch(e){} }
  history.back();
}
$("btnBack").addEventListener("click", goBack);
window.addEventListener("popstate", () => { if (state.sheetOpen) closeSheet(); });


/* ============================================================================
 * 22. PLATFORM GUARDS
 * ==========================================================================*/
document.addEventListener("contextmenu", e => e.preventDefault());

/* Pinch only. Single-finger scrolling inside the bottom sheet still works. */
document.addEventListener("touchmove", e => {
  if (e.touches.length > 1 && e.cancelable) e.preventDefault();
}, { passive:false });

["gesturestart","gesturechange","gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive:false })
);

stage.addEventListener("dragstart", e => e.preventDefault());

document.addEventListener("visibilitychange", () => {
  if (document.hidden){ savePosition(); if (!video.paused) video.pause(); }
});

/* Leave the device brightness the way we found it */
window.addEventListener("pagehide", () => {
  savePosition();
  bridgeBrightness(state.brightness);
});

/* Anything that can change the layout has to refresh the cached track geometry,
   or the thumb lands in the wrong place and scrubbing reads the wrong ratio. */
function onViewportChange(){
  G.live = false; G.axis = null; state.gesture = null;
  GFrame.seek = false; GFrame.level = null;
  dimEl.classList.remove("live");
  if (state.scrubbing) endScrub();
  measureTimeline();
  lastProg = -1; lastBuf = ""; lastCur = "";
  queuePaint();
}
window.addEventListener("orientationchange", () => setTimeout(onViewportChange, 220));
window.addEventListener("resize", onViewportChange);
document.addEventListener("fullscreenchange", () => setTimeout(onViewportChange, 120));
document.addEventListener("webkitfullscreenchange", () => setTimeout(onViewportChange, 120));


/* ============================================================================
 * 23. KEYBOARD (desktop / TV testing)
 * ==========================================================================*/
document.addEventListener("keydown", e => {
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  if (state.locked){
    if (e.key === "l" || e.key === "L"){ e.preventDefault(); unlockScreen(); }
    return;
  }

  switch (e.key){
    case " ": case "k": case "K": e.preventDefault(); togglePlay(); break;
    case "ArrowRight": e.preventDefault(); skip(CONFIG.seekStep); break;
    case "ArrowLeft":  e.preventDefault(); skip(-CONFIG.seekStep); break;
    case "ArrowUp":    e.preventDefault(); setVolume(state.volume + 0.05, true); fadeHud(700); break;
    case "ArrowDown":  e.preventDefault(); setVolume(state.volume - 0.05, true); fadeHud(700); break;
    case "m": case "M": setVolume(state.volume > 0 ? 0 : 1, true); fadeHud(700); break;
    case "n": case "N": setNight(!state.night, true); break;
    case "f": case "F": toggleFullscreen(); break;
    case "l": case "L": lockScreen(); return;
    case "Escape": if (state.sheetOpen){ e.preventDefault(); closeSheet(); } break;
    default: break;
  }
  showControls();
});


/* ============================================================================
 * 24. BOOT
 * ==========================================================================*/
(function init(){
  const savedSpeed = Store.get("speed", 1);
  state.speed = isNum(savedSpeed) ? clamp(savedSpeed, SPEED_MIN, SPEED_MAX) : 1;

  const savedVol = Store.get("volume", 1);
  setVolume(isNum(savedVol) ? savedVol : 1, false);

  const savedBright = Store.get("brightness", 1);
  state.brightness = isNum(savedBright) ? clamp(savedBright, 0, 1) : 1;

  setNight(Store.get("night", false) === true, false);
  setBrightness(state.brightness, false);

  state.fill = Store.get("fill", false) === true;
  video.classList.toggle("fill", state.fill);

  const savedQuality = Store.get("quality", CONFIG.defaultQuality);
  state.quality = (savedQuality === "auto" || QUALITY_ORDER.indexOf(savedQuality) !== -1)
    ? savedQuality : CONFIG.defaultQuality;
  if (!resolveQualityKey(state.quality)) state.quality = "auto";

  /* The complete title, unabbreviated, everywhere it appears. */
  $("tTitle").textContent = CONFIG.title;
  $("tSub").textContent = CONFIG.subtitle;
  $("loadTitle").textContent = CONFIG.title;
  $("tTitle").setAttribute("title", CONFIG.title);
  document.title = CONFIG.title;

  initPreview();
  lblSpeed.textContent = fmtSpeed(state.speed);
  syncQualityChip();
  syncPlayIcon();
  syncFsIcon();
  showControls(true);
  measureTimeline();

  loadInitial();
})();
</script>
