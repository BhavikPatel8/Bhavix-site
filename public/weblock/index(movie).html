<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="no-referrer">
<title>Vishwanath and Sons</title>

<style>
/* ============================================================================
   TOKENS — pure black chassis, graphite surfaces, single amber accent
   ==========================================================================*/
:root{
  --bg:#000;
  --surface:#121317;
  --raised:#1C1E24;
  --hairline:rgba(255,255,255,.09);
  --text:#EDEEF1;
  --dim:#9AA0AB;
  --faint:#6C7280;
  --amber:#FFB020;
  --amber-soft:rgba(255,176,32,.16);
  --track:rgba(255,255,255,.16);
  --buffer:rgba(255,255,255,.42);
  --glass:rgba(10,11,13,.58);
  --ease:cubic-bezier(.22,.61,.36,1);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);

  /* ---- Z-LADDER (single source of truth) ---------------------------------
     Ripples belong BEHIND the transport buttons they echo. Everything that is
     centred on screen and transient — spinner, seek HUD, level HUD — belongs
     ABOVE the controls, because both are anchored at 50%/50% and would
     otherwise collide with the play button. Layering alone is not enough:
     see the `#stage.ctl` offsets further down, which move the centred layers
     clear of the transport whenever the controls are on screen.

     1 video · 2 dim(night+brightness) · 3 gestures · 4 ripple · 5 controls
     6 spinner · 7 HUD · 8 loading · 9 lock · 10 sheet · 11 notice · 12 toast
     ----------------------------------------------------------------------*/
  --z-video:1; --z-dim:2; --z-gestures:3; --z-ripple:4; --z-controls:5;
  --z-spinner:6; --z-hud:7; --z-load:8; --z-lock:9; --z-sheet:10;
  --z-notice:11; --z-toast:12;

  /* How far each centred layer lifts when the transport is visible. These are
     not round numbers picked by eye: each is (spinner-ring radius + clearance +
     half that layer's own height), so the layer clears BOTH the play button and
     the buffering ring even when the two appear together. The seek HUD is the
     tallest of the three — it carries the position bar — so it lifts furthest. */
  --lift-seek:98px;
  --lift-level:84px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html,body{
  height:100%;width:100%;
  background:#000;color:var(--text);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  font-family:Roboto,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
}

button,input{font:inherit;color:inherit;background:none;border:0;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;cursor:pointer}
svg{display:block;pointer-events:none}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}

/* ============================================================================
   STAGE + VIDEO
   ==========================================================================*/
#stage{position:fixed;inset:0;width:100%;height:100%;background:#000;overflow:hidden}

#video{
  position:absolute;inset:0;z-index:var(--z-video);
  width:100%;height:100%;
  object-fit:contain;background:#000;display:block;
  /* Hidden until the first frame is genuinely decodable, so the WebView's
     default video chrome / grey poster never shows through. */
  opacity:0;transition:opacity .3s var(--ease);
}
#video.ready{opacity:1}
#video.fill{object-fit:cover}

/* One composited black sheet carries BOTH night mode and the brightness
   gesture. Two overlays would double-darken and cost an extra layer. */
/* No permanent `will-change:opacity` here. It used to pin a full-screen RGBA
   layer in GPU memory for the whole session (≈10 MB on a 1080×2400 panel) for
   an overlay that changes only while the brightness gesture is live. The class
   below promotes it for the duration of the drag and lets it go again. */
#dim{
  position:absolute;inset:0;z-index:var(--z-dim);
  background:#000;opacity:0;pointer-events:none;
  transition:opacity .22s linear;
}
#dim.live{will-change:opacity;transition:none}

#gestures{position:absolute;inset:0;z-index:var(--z-gestures);touch-action:none}

/* ============================================================================
   BUFFERING SPINNER (distinct from the initial loading screen)
   ==========================================================================*/
/* The spinner is centred, and so is the play button. Rather than hiding one
   behind the other, the ring grows to sit AROUND the play button whenever the
   transport is on screen, and shrinks back to a plain 38px spinner when the
   controls fade out. It never intercepts touches, so the button underneath
   stays fully tappable while buffering. */
#spinner{
  position:absolute;left:50%;top:50%;z-index:var(--z-spinner);
  width:38px;height:38px;margin:-19px 0 0 -19px;
  border:2.5px solid rgba(255,255,255,.14);
  border-top-color:var(--amber);border-radius:50%;
  animation:spin .8s linear infinite;
  opacity:0;pointer-events:none;
  transition:opacity .18s linear,width .2s var(--ease),height .2s var(--ease),margin .2s var(--ease);
}
#spinner.on{opacity:1}
#stage.ctl #spinner{width:88px;height:88px;margin:-44px 0 0 -44px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================================
   HUDs
   ==========================================================================*/
/* THE FIX for the reported SS1/SS2 glitch.
   Both HUDs are anchored at the exact centre of the stage — and so is the play
   button. Previously the HUD sat one step BELOW the controls in the z-ladder,
   so tapping ±10s painted "−10s / 1:26:44 / 2:40:21" behind the play button and
   the text leaked out on either side of it.
   Two changes make that impossible: the HUDs now sit above the controls, and
   `#stage.ctl` lifts them clear of the transport row while it is visible. When
   the controls are hidden (any swipe hides them) they sit dead centre, which is
   the MX-Player-style placement users expect. */
.hud{
  position:absolute;left:50%;top:50%;z-index:var(--z-hud);
  transform:translate(-50%,-50%);
  pointer-events:none;opacity:0;
  transition:opacity .12s linear,transform .2s var(--ease);
}
.hud.on{opacity:1}
#stage.ctl #hudSeek{transform:translate(-50%,calc(-50% - var(--lift-seek)))}
#stage.ctl #hudLevel{transform:translate(-50%,calc(-50% - var(--lift-level)))}

#hudSeek{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 20px}
#hudSeekDelta{
  font-size:30px;font-weight:600;letter-spacing:-.6px;color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.7);
  display:flex;align-items:center;gap:7px;
}
#hudSeekDelta svg{width:24px;height:24px;fill:#fff;filter:drop-shadow(0 2px 10px rgba(0,0,0,.8))}
#hudSeekTime{font-size:13px;color:rgba(255,255,255,.82);text-shadow:0 1px 8px rgba(0,0,0,.9)}
/* Where the swipe will land you, on the scale of the whole movie. */
#hudSeekBar{
  width:148px;height:3px;margin-top:4px;border-radius:2px;
  background:rgba(255,255,255,.22);overflow:hidden;
  box-shadow:0 1px 6px rgba(0,0,0,.6);
}
#hudSeekBarFill{height:100%;background:var(--amber);transform-origin:left center;transform:scaleX(0)}

#hudLevel{
  width:180px;padding:14px 16px 12px;
  background:var(--glass);border:1px solid var(--hairline);border-radius:14px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.hud-row{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.hud-row svg{width:20px;height:20px;flex:none;fill:var(--text)}
#hudLevelLabel{font-size:12.5px;color:var(--dim);flex:1}
#hudLevelValue{font-size:18px;font-weight:600;letter-spacing:-.3px}
.hud-track{height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.hud-fill{height:100%;background:var(--amber);transform-origin:left center;transform:scaleX(0);will-change:transform}

/* Deliberately BELOW the controls: on a 360px-wide phone a 120px ripple
   overlaps the ±10s buttons, and a translucent wash sitting on top of an icon
   reads as a rendering fault. Behind them it reads as a touch echo. */
.ripple{
  position:absolute;top:50%;z-index:var(--z-ripple);
  width:120px;height:120px;margin-top:-60px;border-radius:50%;
  background:rgba(255,255,255,.13);transform:scale(.4);opacity:0;pointer-events:none;
}
.ripple.go{animation:rip .42s var(--ease)}
@keyframes rip{0%{transform:scale(.4);opacity:.85}100%{transform:scale(1.5);opacity:0}}

/* ============================================================================
   CONTROLS
   ==========================================================================*/
/* `visibility` is what actually stops the WebView painting this subtree. With
   opacity alone the four backdrop-filter surfaces underneath (play button,
   chips, preview bubble) keep their blur layers alive and get re-composited
   every frame even at opacity:0. The zero-duration visibility step is delayed
   by the fade length so the transition still looks identical. */
#controls{
  position:absolute;inset:0;z-index:var(--z-controls);
  pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .2s var(--ease),visibility 0s linear .2s;
}
#controls.on{opacity:1;visibility:visible;transition:opacity .2s var(--ease),visibility 0s linear 0s}
#controls.on button,#controls.on .hit{pointer-events:auto}

.scrim-b{position:absolute;left:0;right:0;bottom:0;height:164px;pointer-events:none;
  background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,.44) 48%,transparent)}

/* The top scrim used to be a separate 120px-tall element. A title that wrapped
   past two lines would run out the bottom of it and sit on bare video. Carrying
   the gradient on the bar itself means it always grows to cover the full title,
   however long — and it is one less DOM node to composite. */
.topbar{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:flex-start;gap:2px;
  padding:calc(8px + var(--st)) calc(8px + var(--sr)) 34px calc(8px + var(--sl));
  background:linear-gradient(180deg,rgba(0,0,0,.84),rgba(0,0,0,.42) 56%,transparent);
}
/* Title: the complete name, always. It wraps as far as it needs to and is never
   clamped or ellipsised. min-width:0 lets it shrink inside the flex row so it
   can never push the buttons off-screen. */
.titles{flex:1;min-width:0;padding:5px 6px 0}
.titles h1{
  font-size:clamp(13px,3.9vw,15.5px);
  font-weight:600;letter-spacing:-.2px;line-height:1.24;
  overflow-wrap:break-word;word-break:normal;hyphens:none;
  text-shadow:0 1px 10px rgba(0,0,0,.6);
}
.titles p{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden}

.ib{
  width:42px;height:42px;flex:none;
  display:grid;place-items:center;border-radius:11px;
  transition:background .12s linear,transform .1s linear;
  color:var(--text);
}
.ib svg{width:22px;height:22px;fill:var(--text)}
.ib.sm{width:38px;height:38px}
.ib.sm svg{width:20px;height:20px}
.ib:active{background:var(--raised);transform:scale(.92)}
.ib[disabled]{opacity:.34;pointer-events:none}

/* Night-mode moon: neutral outline when off, amber fill + soft glow when on */
#btnNight svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;transition:filter .2s var(--ease)}
#btnNight.active{color:var(--amber)}
#btnNight.active svg{fill:var(--amber);stroke:var(--amber);filter:drop-shadow(0 0 5px rgba(255,176,32,.55))}

.transport{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:32px;
}
.transport .skip{width:50px;height:50px}
.transport .skip svg{width:29px;height:29px}
.playbtn{
  width:70px;height:70px;display:grid;place-items:center;border-radius:50%;
  background:rgba(12,13,16,.5);border:1px solid var(--hairline);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .12s var(--ease),background .12s linear;
}
.playbtn svg{width:30px;height:30px;fill:var(--text)}
.playbtn:active{transform:scale(.9);background:var(--raised)}

.bottombar{position:absolute;left:0;right:0;bottom:0;padding:0 calc(12px + var(--sr)) calc(8px + var(--sb)) calc(12px + var(--sl))}

.timeline{position:relative;height:28px;display:flex;align-items:center;touch-action:none}
.tl-track{position:absolute;left:0;right:0;top:50%;height:3.5px;margin-top:-1.75px;background:var(--track);border-radius:3px;overflow:hidden}
.tl-buf,.tl-prog{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);will-change:transform}
.tl-buf{background:var(--buffer)}
.tl-prog{background:var(--amber)}
/* The thumb used to be positioned with `left:%`, which forces a layout pass on
   every timeupdate and on every frame of a scrub. It is now translated on the
   compositor instead. The grow-on-scrub effect moved to the inner dot so the
   two transforms never overwrite each other. */
.tl-thumb{
  position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;
  will-change:transform;
}
.tl-dot{
  display:block;width:100%;height:100%;border-radius:50%;
  background:var(--amber);box-shadow:0 0 0 0 var(--amber-soft);
  transition:box-shadow .15s var(--ease),transform .15s var(--ease);
}
.timeline.scrub .tl-dot{transform:scale(1.3);box-shadow:0 0 0 9px var(--amber-soft)}
.tl-preview{
  position:absolute;bottom:28px;left:0;transform:translate3d(0,0,0) translateX(-50%);
  padding:5px 10px;font-size:12.5px;
  background:var(--glass);border:1px solid var(--hairline);border-radius:8px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;transition:opacity .12s linear;pointer-events:none;white-space:nowrap;
}
.timeline.scrub .tl-preview{opacity:1}

.actions{display:flex;align-items:center;gap:3px;margin-top:1px}
.times{font-size:12.5px;color:var(--dim);padding:0 6px 0 2px;flex:none;white-space:nowrap}
.times b{color:var(--text);font-weight:500}
.grow{flex:1;min-width:6px}

.chip{
  height:32px;display:flex;align-items:center;gap:6px;
  padding:0 11px;border-radius:9px;border:1px solid var(--hairline);
  font-size:12.5px;white-space:nowrap;
  transition:background .12s linear,transform .1s linear;
}
.chip svg{width:15px;height:15px;fill:var(--dim);flex:none}
.chip:active{background:var(--raised);transform:scale(.95)}

@media (max-width:430px){
  .chip{padding:0 9px;gap:5px}
  .chip .lbl{display:none}
  .transport{gap:26px}
}
@media (max-width:340px){
  .times{font-size:11.5px}
  .ib{width:38px;height:38px}
}
@media (max-height:430px) and (orientation:landscape){
  :root{--lift-seek:84px;--lift-level:76px}
  .scrim-b{height:130px}
  .playbtn{width:60px;height:60px}
  .playbtn svg{width:26px;height:26px}
  .transport .skip{width:44px;height:44px}
  .transport .skip svg{width:25px;height:25px}
  #stage.ctl #spinner{width:78px;height:78px;margin:-39px 0 0 -39px}
  .topbar{padding-top:calc(5px + var(--st));padding-bottom:26px}
  .titles h1{font-size:14.5px}
  #hudSeekDelta{font-size:26px}
}

/* ============================================================================
   CUSTOM LOADING LAYER — replaces any default player visuals
   ==========================================================================*/
#loading{
  position:absolute;inset:0;z-index:var(--z-load);
  display:grid;place-items:center;
  background:#000;
  transition:opacity .35s var(--ease);
  padding:24px;
}
#loading.gone{opacity:0;visibility:hidden;pointer-events:none}
.load-in{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:86vw}

/* Preview card, then the complete movie name directly beneath it.
   Sized with clamp() rather than aspect-ratio so it holds its 16:9 shape on
   older WebView builds too. It costs nothing on the network: CONFIG.poster is
   optional, and with no artwork the card draws its own mark. */
.load-card{
  position:relative;flex:none;
  width:clamp(176px,62vw,300px);height:clamp(99px,34.87vw,169px);
  margin-bottom:18px;border-radius:14px;overflow:hidden;
  background:linear-gradient(145deg,#171a20,#0a0b0e);
  border:1px solid var(--hairline);
  box-shadow:0 14px 34px rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;
}
#loadPoster{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .35s var(--ease);
}
#loadPoster.on{opacity:1}
.load-glyph{
  position:relative;width:34px;height:34px;fill:var(--amber);opacity:.92;
  filter:drop-shadow(0 0 14px rgba(255,176,32,.34));
}
.load-card.art .load-glyph{fill:#fff;filter:drop-shadow(0 2px 10px rgba(0,0,0,.75))}
/* Indeterminate sweep along the bottom edge — the card's own progress hint,
   which replaces the old free-floating ring. One animated element, not two. */
.load-sweep{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.09);overflow:hidden}
.load-sweep::after{
  content:"";position:absolute;top:0;bottom:0;left:0;width:38%;
  background:linear-gradient(90deg,transparent,var(--amber),transparent);
  animation:sweep 1.3s var(--ease) infinite;
}
@keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}

/* The complete title, wrapped as far as it needs to go — never clamped. */
#loadTitle{
  font-size:clamp(15px,4.6vw,19px);font-weight:600;letter-spacing:-.3px;
  line-height:1.3;overflow-wrap:break-word;word-break:normal;
}
#loadMsg{margin-top:7px;font-size:12.5px;color:var(--faint);letter-spacing:.2px}

@media (max-height:430px) and (orientation:landscape){
  .load-card{width:clamp(150px,27vw,236px);height:clamp(84px,15.19vw,133px);margin-bottom:13px}
  .load-glyph{width:28px;height:28px}
  #loadTitle{font-size:clamp(14px,2.6vw,17px)}
}

/* ============================================================================
   LOCK MODE
   ==========================================================================*/
#lock{position:absolute;inset:0;z-index:var(--z-lock);display:none;touch-action:none}
#lock.on{display:block}
#unlockBtn{
  position:absolute;top:50%;left:calc(16px + var(--sl));
  transform:translateY(-50%) scale(.85);
  width:50px;height:50px;display:grid;place-items:center;border-radius:50%;
  background:rgba(12,13,16,.34);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;
  transition:opacity .18s var(--ease),transform .18s var(--ease);
}
#unlockBtn.on{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
#unlockBtn svg{width:22px;height:22px;fill:rgba(255,255,255,.9)}
#unlockBtn:active{transform:translateY(-50%) scale(.92)}

/* Unlocking brings the controls straight back, so this pill is another centred
   layer that could land on the play button. It rides the same lift. */
#lockFlash{
  --fy:0px;
  position:absolute;left:50%;top:50%;z-index:var(--z-toast);
  transform:translate(-50%,calc(-50% + var(--fy)));
  display:flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:20px;background:rgba(0,0,0,.22);
  font-size:13px;color:rgba(255,255,255,.88);
  text-shadow:0 1px 8px rgba(0,0,0,.8);
  opacity:0;pointer-events:none;
}
#lockFlash svg{width:15px;height:15px;fill:rgba(255,255,255,.88);filter:drop-shadow(0 1px 6px rgba(0,0,0,.8))}
#lockFlash.go{animation:flash 1.25s var(--ease) forwards}
#stage.ctl #lockFlash{--fy:calc(0px - var(--lift-level))}
@keyframes flash{
  0%{opacity:0;transform:translate(-50%,calc(-50% + var(--fy))) scale(.94)}
  12%{opacity:1;transform:translate(-50%,calc(-50% + var(--fy))) scale(1)}
  72%{opacity:1}
  100%{opacity:0;transform:translate(-50%,calc(-50% + var(--fy))) scale(1)}
}

/* ============================================================================
   BOTTOM SHEET
   ==========================================================================*/
#sheet{position:absolute;inset:0;z-index:var(--z-sheet);display:none}
#sheet.on{display:block}
#sheetBack{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.panel{
  position:absolute;left:0;right:0;bottom:0;max-height:80%;
  display:flex;flex-direction:column;
  background:var(--surface);border-top:1px solid var(--hairline);
  border-radius:18px 18px 0 0;padding-bottom:var(--sb);
  transform:translateY(100%);animation:up .22s var(--ease) forwards;
}
@keyframes up{to{transform:translateY(0)}}
.grip{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.16);margin:9px auto 2px;flex:none}
.shead{display:flex;align-items:center;gap:8px;padding:6px 8px 8px 18px;flex:none}
.shead h2{font-size:15px;font-weight:600;flex:1;letter-spacing:-.2px}
.snote{padding:0 18px 12px;font-size:12px;color:var(--dim);line-height:1.5;max-width:62ch}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:0 8px 14px}

.opt{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:11px;text-align:left;transition:background .12s linear}
.opt:active{background:var(--raised)}
.opt-t{flex:1;min-width:0}
.opt-l{font-size:14.5px}
.opt-m{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.opt-tick{width:20px;height:20px;flex:none;fill:var(--amber);opacity:0}
.opt.sel .opt-l{color:var(--amber);font-weight:500}
.opt.sel .opt-tick{opacity:1}
.opt.off{opacity:.42;pointer-events:none}
.opt.off .opt-m{color:var(--faint)}

.speedwrap{padding:4px 14px 8px}
.speedval{font-size:34px;font-weight:600;letter-spacing:-1px;text-align:center;color:var(--amber);margin:2px 0 14px}
.speedslider{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;touch-action:none;display:block}
.speedslider::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:var(--track)}
.speedslider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--amber);margin-top:-9px;border:0;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.speedslider::-moz-range-track{height:4px;border-radius:3px;background:var(--track)}
.speedslider::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--amber)}
.speedends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:2px}
.speedticks{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 4px;justify-content:center}
.tick{padding:6px 11px;border:1px solid var(--hairline);border-radius:9px;font-size:12.5px;color:var(--dim)}
.tick:active{background:var(--raised)}
.srow{display:flex;gap:10px;padding:16px 14px 6px}
.btn{flex:1;height:44px;border-radius:11px;font-size:14.5px;font-weight:500;display:grid;place-items:center}
.btn.ghost{border:1px solid var(--hairline);color:var(--text)}
.btn.primary{background:var(--amber);color:#000}
.btn:active{transform:scale(.98)}

/* ============================================================================
   NOTICE + TOAST
   ==========================================================================*/
#notice{position:absolute;inset:0;z-index:var(--z-notice);display:none;place-items:center;background:#000;padding:30px;text-align:center}
#notice.on{display:grid}
#notice .in{max-width:44ch}
#notice h3{font-size:16px;font-weight:600;margin-bottom:7px}
#notice p{font-size:13px;color:var(--dim);line-height:1.6}
#notice button{margin-top:18px;padding:11px 22px;border-radius:10px;background:var(--amber);color:#000;font-size:14px;font-weight:600}

/* At 26px the toast sat squarely on top of the speed/quality chips whenever the
   controls were up — and every toast in this player is fired by a control.
   It now clears the whole bottom bar while they are visible. */
#toast{
  position:absolute;left:50%;bottom:calc(26px + var(--sb));transform:translateX(-50%);
  transition:opacity .2s var(--ease),bottom .2s var(--ease);
  z-index:var(--z-toast);
  padding:8px 15px;border-radius:20px;
  background:var(--glass);border:1px solid var(--hairline);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:12.5px;color:var(--text);
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease);
  white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.on{opacity:1}
#stage.ctl #toast{bottom:calc(96px + var(--sb))}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

  if (!isNum(sec) || sec < 0) sec = 0;
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return h > 0 ? h + ":" + p(m) + ":" + p(s) : p(m) + ":" + p(s);

  if (!isNum(mb) || mb <= 0) return "0 MB";
  if (mb < 1) return "under 1 MB";
  return Math.round(mb) + " MB";

/* A swipe of two and a half minutes reads far better as "+2:30" than "+150s" */

  const a = Math.abs(Math.round(sec));
  if (a < 60) return a + "s";
  return Math.floor(a / 60) + ":" + String(a % 60).padStart(2, "0");

  if (preset !== undefined) return (preset === 1 ? "1" : String(preset)) + "x";

  set(name, fn, ms){
    this.clear(name);
    this.map.set(name, setTimeout(() => { this.map.delete(name); fn(); }, ms));

  clear(name){
    const t = this.map.get(name);

  has(name){ return this.map.has(name); }
};

  get(key, fallback){
    if (!this.ok) return fallback;
    try { const v = localStorage.getItem("vp:" + key); return v === null ? fallback : JSON.parse(v); }
