<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10141d">
<meta name="color-scheme" content="dark">
<title>Daily Prayer</title>

<style>
    :root {
        --app-background: #10141d;
        --page-background: #fffaf0;
        --page-gap: 12px;
        --page-max-width: 900px;
        --side-space: 8px;
        --accent: #19b7a5;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    html {
        width: 100%;
        min-height: 100%;
        background: var(--app-background);
        -webkit-text-size-adjust: 100%;
    }

    body {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;

        overflow-x: auto;
        overflow-y: auto;

        background: var(--app-background);
        color: #ffffff;

        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        overscroll-behavior-y: contain;

        /* Let the browser handle single/two-finger panning natively, but
           suppress native double-tap / pinch page-zoom so our own zoom
           logic is the only thing that scales the document. */
        touch-action: manipulation;
    }

    /* PDF document area */
    #pdf-container {
        width: 100%;
        min-width: 100%;
        min-height: 100vh;

        margin: 0 auto;

        padding: max(8px, env(safe-area-inset-top)) var(--side-space) max(90px, env(safe-area-inset-bottom));

        transform-origin: 0 0;

        /* No text selection / callout menus over reading content. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
    }

    #pdf-container.pinch-active {
        will-change: transform;
    }

    /* Individual PDF page */
    .pdf-page {
        position: relative;

        width: 100%;
        max-width: var(--page-max-width);

        margin: 0 auto var(--page-gap);

        overflow: hidden;

        background: var(--page-background);

        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.05);

        contain: layout paint;
    }

    .pdf-page:last-child {
        margin-bottom: 0;
    }

    .pdf-page canvas {
        display: block;

        width: 100%;
        height: 100%;

        background: var(--page-background);

        opacity: 0;
        transition: opacity 180ms ease;
    }

    .pdf-page.rendered canvas {
        opacity: 1;
    }

    /* Loading placeholder for every page */
    .page-placeholder {
        position: absolute;
        inset: 0;
        z-index: 1;

        overflow: hidden;

        background: var(--page-background);
        transition: opacity 180ms ease;
    }

    .page-placeholder::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);

        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.52), transparent);

        animation: page-shimmer 1.3s infinite;
    }

    .pdf-page.rendered .page-placeholder {
        pointer-events: none;
        opacity: 0;
    }

    @keyframes page-shimmer {
        100% { transform: translateX(100%); }
    }

    /* Main loading screen */
    #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        background: var(--app-background);

        transition: opacity 220ms ease, visibility 220ms ease;
    }

    #loading-screen.hidden {
        visibility: hidden;
        pointer-events: none;
        opacity: 0;
    }

    .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
    }

    .spinner {
        width: 42px;
        height: 42px;

        border: 4px solid rgba(255, 255, 255, 0.16);
        border-top-color: var(--accent);
        border-radius: 50%;

        animation: spin 800ms linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    #loading-text {
        color: rgba(255, 255, 255, 0.82);
        font-size: 14px;
        line-height: 1.5;
    }

    /* Error screen */
    #error-screen {
        display: none;

        min-height: 100vh;
        min-height: 100dvh;

        align-items: center;
        justify-content: center;

        padding: 24px;

        background: var(--app-background);
    }

    #error-screen.visible {
        display: flex;
    }

    .error-card {
        width: min(100%, 420px);
        padding: 24px;

        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;

        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);

        text-align: center;
    }

    .error-icon {
        margin-bottom: 12px;
        font-size: 34px;
    }

    .error-title {
        margin-bottom: 8px;
        font-size: 18px;
        font-weight: 700;
    }

    .error-message {
        color: rgba(255, 255, 255, 0.72);
        font-size: 13px;
        line-height: 1.6;
        overflow-wrap: anywhere;
    }

    .retry-button {
        margin-top: 18px;
        padding: 11px 20px;

        border: 0;
        border-radius: 999px;

        background: var(--accent);
        color: #07120f;

        font: inherit;
        font-size: 14px;
        font-weight: 700;

        cursor: pointer;
    }

    .retry-button:active {
        transform: scale(0.97);
    }

    /* Floating zoom widget: hidden panel + small trigger button */
    #zoom-widget {
        position: fixed;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        z-index: 9000;

        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
    }

    #zoom-panel {
        display: flex;
        align-items: center;
        gap: 7px;

        padding: 7px;

        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 18px;

        background: rgba(24, 30, 41, 0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.36);

        opacity: 0;
        transform: scale(0.85) translateY(8px);
        transform-origin: bottom right;
        pointer-events: none;

        transition: opacity 180ms ease, transform 180ms ease;
    }

    #zoom-panel.visible {
        opacity: 1;
        transform: scale(1) translateY(0);
        pointer-events: auto;
    }

    .zoom-button {
        display: flex;
        align-items: center;
        justify-content: center;

        width: 42px;
        height: 42px;

        border: 0;
        border-radius: 13px;

        background: rgba(255, 255, 255, 0.09);
        color: #ffffff;

        font-family: inherit;
        font-size: 22px;
        font-weight: 600;

        cursor: pointer;
        touch-action: manipulation;
    }

    .zoom-button:active {
        transform: scale(0.93);
        background: rgba(255, 255, 255, 0.16);
    }

    .zoom-button:disabled {
        opacity: 0.4;
    }

    #zoom-reset {
        min-width: 58px;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 700;
    }

    #zoom-level {
        min-width: 48px;
        color: rgba(255, 255, 255, 0.82);
        font-size: 12px;
        font-weight: 700;
        text-align: center;
    }

    #zoom-fab {
        display: flex;
        align-items: center;
        justify-content: center;

        width: 46px;
        height: 46px;

        border: 0;
        border-radius: 50%;

        background: rgba(24, 30, 41, 0.92);
        color: #ffffff;

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.34);

        cursor: pointer;
        touch-action: manipulation;
        transition: transform 150ms ease, background 150ms ease;
    }

    #zoom-fab:active {
        transform: scale(0.92);
        background: rgba(255, 255, 255, 0.14);
    }

    #zoom-fab svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    noscript {
        display: block;
        padding: 30px 20px;
        color: white;
        text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }

    @media (min-width: 768px) {
        :root {
            --page-gap: 16px;
            --side-space: 14px;
        }

        #pdf-container {
            padding-top: 14px;
            padding-bottom: 100px;
        }
    }
</style>
</head>

<body>

<!-- Loading screen -->
<div id="loading-screen" role="status" aria-live="polite">
    <div class="loader-content">
        <div class="spinner" aria-hidden="true"></div>
        <div id="loading-text">Loading document...</div>
    </div>
</div>

<!-- Rendered PDF pages -->
<main id="pdf-container" aria-label="Daily Prayer document"></main>

<!-- Floating zoom control: hidden by default, revealed via the small trigger button -->
<div id="zoom-widget">
    <div id="zoom-panel" role="group" aria-label="Document zoom controls">
        <button type="button" class="zoom-button" id="zoom-out" aria-label="Zoom out">−</button>
        <div id="zoom-level" aria-live="polite">100%</div>
        <button type="button" class="zoom-button" id="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" class="zoom-button" id="zoom-reset" aria-label="Reset zoom">Reset</button>
    </div>

    <button type="button" id="zoom-fab" aria-label="Zoom" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <line x1="15.3" y1="15.3" x2="21" y2="21"></line>
            <line x1="7.5" y1="10.5" x2="13.5" y2="10.5"></line>
            <line x1="10.5" y1="7.5" x2="10.5" y2="13.5"></line>
        </svg>
    </button>
</div>

<!-- Error screen -->
<section id="error-screen" role="alert">
    <div class="error-card">
        <div class="error-icon" aria-hidden="true">⚠️</div>
        <div class="error-title">Unable to open the document</div>
        <div class="error-message" id="error-message">Please check the document files and try again.</div>
        <button type="button" class="retry-button" onclick="window.location.reload()">Try Again</button>
    </div>
</section>

<noscript>JavaScript must be enabled to view this document.</noscript>

<script type="module">
"use strict";

/*
 * Required folder structure:
 *
 * public/
 * └── documents/
 *     ├── index.html
 *     ├── prayer-note.pdf
 *     └── pdfjs/
 *         ├── pdf.mjs
 *         └── pdf.worker.mjs
 */

const BASE_PATH = "/documents/";
const PDF_URL = "/documents/prayer-note.pdf";
const PDFJS_MODULE_URL = "/documents/pdfjs/pdf.mjs";
const PDFJS_WORKER_URL = "/documents/pdfjs/pdf.worker.mjs";

/* ---------------------------------------------------------------------
 * Tunables
 * ------------------------------------------------------------------- */

// Each page is rendered exactly once, up front, at a resolution high
// enough to stay sharp all the way up to MAX_ZOOM without ever
// re-rendering. Zoom afterwards is pure CSS/layout scaling.
const MAX_DEVICE_PIXEL_RATIO = 2;   // cap on devicePixelRatio contribution
const QUALITY_MULTIPLIER = 1.1;     // slight oversampling for crisper text
const MAX_CANVAS_PIXELS = 4_500_000; // absolute safety cap (~4.5 MP) per canvas,
                                      // protects Android WebView from OOM

// Zoom behaviour (CSS/layout scaling only — never touches PDF.js again).
const MIN_ZOOM = 1;
const MAX_ZOOM = 2.5;
const ZOOM_STEP = 0.25;
const WHEEL_ZOOM_STEP = 0.12;

// Pages are pre-rendered assuming zoom may reach this level, so the
// existing bitmap stays crisp when later stretched via CSS.
const RENDER_QUALITY_ZOOM = MAX_ZOOM;

// Lazy loading.
const OBSERVER_MARGIN = "150% 0px";

// Debounce for layout-only work (no rendering involved).
const RESIZE_DEBOUNCE_DELAY = 200; // ms
const PANEL_AUTO_HIDE_DELAY = 4000; // ms

/* ---------------------------------------------------------------------
 * Element references
 * ------------------------------------------------------------------- */

const container = document.getElementById("pdf-container");
const loadingScreen = document.getElementById("loading-screen");
const loadingText = document.getElementById("loading-text");
const errorScreen = document.getElementById("error-screen");
const errorMessage = document.getElementById("error-message");

const zoomWidget = document.getElementById("zoom-widget");
const zoomPanel = document.getElementById("zoom-panel");
const zoomFab = document.getElementById("zoom-fab");
const zoomOutButton = document.getElementById("zoom-out");
const zoomInButton = document.getElementById("zoom-in");
const zoomResetButton = document.getElementById("zoom-reset");
const zoomLevelText = document.getElementById("zoom-level");

/* ---------------------------------------------------------------------
 * State
 * ------------------------------------------------------------------- */

let pdfDocument = null;
let pageObserver = null;
let pageElements = [];

let basePageWidth = 0;
let committedZoom = 1; // the only zoom concept: a pure CSS width multiplier
let firstPageShown = false;

const renderedPages = new Set();  // pages that have been rendered — permanently, once
const renderingPages = new Set(); // pages currently in their one-time render

let resizeTimer = null;
let panelHideTimer = null;

let gesture = null; // active pinch-gesture state, or null

/* ---------------------------------------------------------------------
 * Small helpers
 * ------------------------------------------------------------------- */

function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
}

function clampZoom(value) {
    return clamp(value, MIN_ZOOM, MAX_ZOOM);
}

function updateLoadingText(message) {
    loadingText.textContent = message;
}

function hideLoadingScreen() {
    loadingScreen.classList.add("hidden");
}

function showError(error) {
    console.error("PDF Viewer Error:", error);

    hideLoadingScreen();

    container.hidden = true;
    zoomWidget.hidden = true;

    errorScreen.classList.add("visible");

    let message = "Please check the document files and try again.";

    if (error instanceof Error && error.message) {
        message += ` (${error.message})`;
    }

    errorMessage.textContent = message;
}

function getAvailablePageWidth() {
    const containerStyle = window.getComputedStyle(container);
    const leftPadding = parseFloat(containerStyle.paddingLeft) || 0;
    const rightPadding = parseFloat(containerStyle.paddingRight) || 0;

    return clamp(window.innerWidth - leftPadding - rightPadding, 280, 900);
}

function getTouchDistance(touchA, touchB) {
    return Math.hypot(touchB.clientX - touchA.clientX, touchB.clientY - touchA.clientY);
}

function getTouchCenter(touchA, touchB) {
    return {
        x: (touchA.clientX + touchB.clientX) / 2,
        y: (touchA.clientY + touchB.clientY) / 2
    };
}

/* ---------------------------------------------------------------------
 * Zoom panel visibility (hidden by default; shown via the small FAB)
 * ------------------------------------------------------------------- */

function openZoomPanel() {
    zoomPanel.classList.add("visible");
    zoomFab.setAttribute("aria-expanded", "true");
    restartPanelHideTimer();
}

function closeZoomPanel() {
    zoomPanel.classList.remove("visible");
    zoomFab.setAttribute("aria-expanded", "false");
    window.clearTimeout(panelHideTimer);
}

function restartPanelHideTimer() {
    window.clearTimeout(panelHideTimer);
    panelHideTimer = window.setTimeout(closeZoomPanel, PANEL_AUTO_HIDE_DELAY);
}

zoomFab.addEventListener("click", () => {
    if (zoomPanel.classList.contains("visible")) {
        closeZoomPanel();
    } else {
        openZoomPanel();
    }
});

document.addEventListener(
    "click",
    event => {
        if (!zoomPanel.classList.contains("visible")) {
            return;
        }
        if (zoomPanel.contains(event.target) || zoomFab.contains(event.target)) {
            return;
        }
        closeZoomPanel();
    },
    { passive: true }
);

/* ---------------------------------------------------------------------
 * Zoom: pure CSS/layout scaling of already-rendered pages.
 *
 * PDF.js is never touched again after the one-time initial render.
 * Each page's <canvas> keeps width:100%; height:100% (see stylesheet),
 * so it automatically stretches to whatever size its .pdf-page
 * container currently has — zooming is just changing that container
 * width, nothing else.
 * ------------------------------------------------------------------- */

function updateZoomDisplay(liveZoomOverride) {
    const displayZoom = liveZoomOverride ?? committedZoom;

    zoomLevelText.textContent = `${Math.round(displayZoom * 100)}%`;
    zoomOutButton.disabled = committedZoom <= MIN_ZOOM;
    zoomInButton.disabled = committedZoom >= MAX_ZOOM;
}

function applyPageWidths() {
    const newWidth = basePageWidth * committedZoom;

    for (const pageElement of pageElements) {
        pageElement.style.width = `${newWidth}px`;
    }

    container.style.minWidth = committedZoom > 1
        ? `${Math.max(window.innerWidth, newWidth + 16)}px`
        : "100%";
}

/**
 * Bakes a new zoom level into the real page widths, preserving the
 * on-screen position of a given anchor point. Purely layout math —
 * no canvas is touched, no PDF.js call is made.
 */
function applyZoom(targetZoom, anchorClientPoint) {
    const clamped = clampZoom(targetZoom);

    if (Math.abs(clamped - committedZoom) < 0.001) {
        updateZoomDisplay();
        return;
    }

    const anchorX = anchorClientPoint ? anchorClientPoint.x : window.innerWidth / 2;
    const anchorY = anchorClientPoint ? anchorClientPoint.y : window.innerHeight / 2;

    const beforeScrollY = window.scrollY;
    const beforeScrollX = window.scrollX;
    const beforeScrollHeight = Math.max(document.documentElement.scrollHeight, 1);
    const beforeScrollWidth = Math.max(document.documentElement.scrollWidth, 1);

    const ratioY = (beforeScrollY + anchorY) / beforeScrollHeight;
    const ratioX = (beforeScrollX + anchorX) / beforeScrollWidth;

    committedZoom = clamped;
    applyPageWidths();
    updateZoomDisplay();

    requestAnimationFrame(() => {
        const afterScrollHeight = Math.max(document.documentElement.scrollHeight, 1);
        const afterScrollWidth = Math.max(document.documentElement.scrollWidth, 1);

        const newScrollY = Math.max(0, ratioY * afterScrollHeight - anchorY);
        const newScrollX = Math.max(0, ratioX * afterScrollWidth - anchorX);

        window.scrollTo({ top: newScrollY, left: newScrollX, behavior: "auto" });
    });
}

/* ---------------------------------------------------------------------
 * Rendering — each page is rendered exactly once, ever. There is no
 * offscreen buffer, no swap, and nothing here is ever invoked again
 * because of a zoom change, a resize, or an orientation change.
 * ------------------------------------------------------------------- */

async function renderPage(pageElement) {
    const pageNumber = Number(pageElement.dataset.pageNumber);

    if (renderedPages.has(pageNumber) || renderingPages.has(pageNumber)) {
        return;
    }

    renderingPages.add(pageNumber);

    try {
        const page = await pdfDocument.getPage(pageNumber);

        const canvas = pageElement.querySelector("canvas");
        const context = canvas.getContext("2d", { alpha: false, desynchronized: true });

        if (!context) {
            throw new Error(`Canvas context unavailable on page ${pageNumber}.`);
        }

        const baseViewport = page.getViewport({ scale: 1 });

        // Resolution is computed against the fit-to-width baseline and the
        // maximum zoom level up front — this is the only render that will
        // ever happen for this page, so it has to stay sharp all the way
        // up to MAX_ZOOM using nothing but CSS stretching afterwards.
        const cssScale = basePageWidth / baseViewport.width;
        const deviceRatio = Math.min(window.devicePixelRatio || 1, MAX_DEVICE_PIXEL_RATIO);

        let renderScale = cssScale * RENDER_QUALITY_ZOOM * deviceRatio * QUALITY_MULTIPLIER;
        let renderViewport = page.getViewport({ scale: renderScale });

        // Hard safety cap: never let a single canvas exceed a safe pixel
        // budget, regardless of zoom headroom or device pixel ratio.
        const projectedPixels = renderViewport.width * renderViewport.height;
        if (projectedPixels > MAX_CANVAS_PIXELS) {
            const shrink = Math.sqrt(MAX_CANVAS_PIXELS / projectedPixels);
            renderScale *= shrink;
            renderViewport = page.getViewport({ scale: renderScale });
        }

        canvas.width = Math.max(1, Math.floor(renderViewport.width));
        canvas.height = Math.max(1, Math.floor(renderViewport.height));
        // No inline canvas.style.width/height is set here on purpose —
        // the stylesheet's width:100%; height:100% makes the canvas
        // always fill its .pdf-page container, at whatever zoom that
        // container currently is. That is the entire zoom mechanism.

        await page.render({
            canvasContext: context,
            viewport: renderViewport,
            background: "rgb(255, 250, 240)"
        }).promise;

        renderedPages.add(pageNumber);
        pageElement.classList.add("rendered");

        page.cleanup();

        if (pageNumber === 1 && !firstPageShown) {
            firstPageShown = true;
            hideLoadingScreen();
        }
    } catch (error) {
        console.error(`Page ${pageNumber} rendering failed:`, error);

        pageElement.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:20px;background:#fffaf0;color:#5b2424;font:600 14px system-ui,sans-serif;text-align:center;">
                Page ${pageNumber} could not be displayed.
            </div>
        `;

        if (pageNumber === 1 && !firstPageShown) {
            firstPageShown = true;
            hideLoadingScreen();
        }
    } finally {
        renderingPages.delete(pageNumber);
    }
}

function setupLazyRendering() {
    if (!("IntersectionObserver" in window)) {
        void renderPagesSequentially(pageElements);
        return;
    }

    pageObserver = new IntersectionObserver(
        entries => {
            for (const entry of entries) {
                if (!entry.isIntersecting) {
                    continue;
                }

                void renderPage(entry.target);
                pageObserver.unobserve(entry.target);
            }
        },
        { root: null, rootMargin: OBSERVER_MARGIN, threshold: 0.01 }
    );

    for (const pageElement of pageElements) {
        pageObserver.observe(pageElement);
    }
}

async function renderPagesSequentially(elements) {
    for (const pageElement of elements) {
        await renderPage(pageElement);
    }
}

/* ---------------------------------------------------------------------
 * Page placeholders (one per PDF page, created up front so heights /
 * scroll position are stable before any bitmap has been rendered)
 * ------------------------------------------------------------------- */

async function createPagePlaceholders() {
    const fragment = document.createDocumentFragment();

    basePageWidth = getAvailablePageWidth();

    for (let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++) {
        const page = await pdfDocument.getPage(pageNumber);
        const baseViewport = page.getViewport({ scale: 1 });

        const pageElement = document.createElement("section");
        pageElement.className = "pdf-page";
        pageElement.dataset.pageNumber = String(pageNumber);
        pageElement.style.aspectRatio = `${baseViewport.width} / ${baseViewport.height}`;
        pageElement.style.width = `${basePageWidth}px`;

        const placeholder = document.createElement("div");
        placeholder.className = "page-placeholder";
        placeholder.setAttribute("aria-hidden", "true");

        const canvas = document.createElement("canvas");
        canvas.setAttribute("aria-label", `Document page ${pageNumber}`);

        pageElement.append(placeholder, canvas);
        fragment.appendChild(pageElement);

        page.cleanup();
    }

    container.replaceChildren(fragment);
    pageElements = [...document.querySelectorAll(".pdf-page")];

    applyPageWidths();
}

/* ---------------------------------------------------------------------
 * Zoom controls: buttons, pinch gesture, desktop Ctrl+wheel.
 *
 * All of these only ever call applyZoom()/applyPageWidths() — pure
 * CSS/layout scaling. None of them call renderPage() or touch PDF.js.
 * ------------------------------------------------------------------- */

function setupZoomControls() {
    zoomInButton.addEventListener("click", () => {
        openZoomPanel();
        applyZoom(committedZoom + ZOOM_STEP);
    });

    zoomOutButton.addEventListener("click", () => {
        openZoomPanel();
        applyZoom(committedZoom - ZOOM_STEP);
    });

    zoomResetButton.addEventListener("click", () => {
        openZoomPanel();
        applyZoom(1);
    });

    // --- Pinch-to-zoom -------------------------------------------------
    //
    // While fingers are moving, only a CSS transform preview is applied
    // (compositor-only, no layout, no rendering). Once the gesture ends,
    // the transform is removed and the real page width is set once —
    // still pure CSS, still no rendering.

    container.addEventListener(
        "touchstart",
        event => {
            if (event.touches.length !== 2) {
                return;
            }

            const [touchA, touchB] = event.touches;
            const rect = container.getBoundingClientRect();
            const center = getTouchCenter(touchA, touchB);

            gesture = {
                startDistance: getTouchDistance(touchA, touchB),
                startZoom: committedZoom,
                originX: center.x - rect.left,
                originY: center.y - rect.top,
                lastZoom: committedZoom,
                lastClientX: center.x,
                lastClientY: center.y
            };

            container.style.transformOrigin = `${gesture.originX}px ${gesture.originY}px`;
            container.classList.add("pinch-active");

            openZoomPanel();
        },
        { passive: true }
    );

    container.addEventListener(
        "touchmove",
        event => {
            if (!gesture || event.touches.length !== 2) {
                return;
            }

            // Prevent the browser's own scroll/zoom handling from fighting
            // with our transform while two fingers are down.
            event.preventDefault();

            const [touchA, touchB] = event.touches;
            const currentDistance = getTouchDistance(touchA, touchB);

            const minFactor = MIN_ZOOM / gesture.startZoom;
            const maxFactor = MAX_ZOOM / gesture.startZoom;
            const scaleFactor = clamp(currentDistance / gesture.startDistance, minFactor, maxFactor);

            gesture.lastZoom = gesture.startZoom * scaleFactor;

            const center = getTouchCenter(touchA, touchB);
            gesture.lastClientX = center.x;
            gesture.lastClientY = center.y;

            requestAnimationFrame(() => {
                if (!gesture) {
                    return;
                }
                container.style.transform = `scale(${scaleFactor})`;
            });

            updateZoomDisplay(gesture.lastZoom);
        },
        { passive: false }
    );

    function finishPinch(shouldApply) {
        if (!gesture) {
            return;
        }

        const finishedGesture = gesture;
        gesture = null;

        container.classList.remove("pinch-active");
        container.style.transform = "";
        container.style.transformOrigin = "";

        if (shouldApply) {
            applyZoom(finishedGesture.lastZoom, {
                x: finishedGesture.lastClientX,
                y: finishedGesture.lastClientY
            });
        } else {
            updateZoomDisplay();
        }

        restartPanelHideTimer();
    }

    container.addEventListener(
        "touchend",
        event => {
            if (event.touches.length < 2) {
                finishPinch(true);
            }
        },
        { passive: true }
    );

    container.addEventListener(
        "touchcancel",
        () => finishPinch(false),
        { passive: true }
    );

    // --- Desktop: Ctrl + mouse wheel -----------------------------------

    window.addEventListener(
        "wheel",
        event => {
            if (!event.ctrlKey) {
                return;
            }

            // Stop the browser's own page-zoom from also firing.
            event.preventDefault();

            const direction = event.deltaY > 0 ? -1 : 1;
            const target = committedZoom + direction * WHEEL_ZOOM_STEP;

            openZoomPanel();
            applyZoom(target, { x: event.clientX, y: event.clientY });
        },
        { passive: false }
    );

    updateZoomDisplay();
}

/* ---------------------------------------------------------------------
 * Resize / orientation change — layout only, never re-renders a page.
 * ------------------------------------------------------------------- */

function handleViewportChange() {
    if (!pdfDocument) {
        return;
    }

    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(() => {
        basePageWidth = getAvailablePageWidth();
        applyPageWidths();
        // Intentionally no re-render here: already-rendered canvases keep
        // their existing bitmap and are simply re-stretched by CSS.
    }, RESIZE_DEBOUNCE_DELAY);
}

window.addEventListener("resize", handleViewportChange);
window.addEventListener("orientationchange", handleViewportChange);

window.addEventListener("pageshow", event => {
    if (event.persisted && renderedPages.size === 0) {
        window.location.reload();
    }
});

/* ---------------------------------------------------------------------
 * Startup
 * ------------------------------------------------------------------- */

async function startViewer() {
    try {
        updateLoadingText("Loading document...");

        const pdfjsLib = await import(PDFJS_MODULE_URL);
        pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;

        updateLoadingText("Preparing pages...");

        const loadingTask = pdfjsLib.getDocument({
            url: PDF_URL,
            useSystemFonts: true,
            disableRange: false,
            disableStream: false,
            disableAutoFetch: false
        });

        loadingTask.onProgress = progress => {
            if (!progress.total || progress.total <= 0) {
                return;
            }

            const percent = Math.min(100, Math.round((progress.loaded / progress.total) * 100));
            updateLoadingText(`Preparing pages... ${percent}%`);
        };

        pdfDocument = await loadingTask.promise;

        updateLoadingText("Preparing pages...");

        await createPagePlaceholders();

        const firstPage = document.querySelector('.pdf-page[data-page-number="1"]');
        if (!firstPage) {
            throw new Error("The first document page could not be created.");
        }

        await renderPage(firstPage);

        setupLazyRendering();
        setupZoomControls();
    } catch (error) {
        showError(error);
    }
}

void startViewer();
</script>
