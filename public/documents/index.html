<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=5.0,
            minimum-scale=1.0,
            user-scalable=yes,
            viewport-fit=cover
        "
    >

    <meta name="theme-color" content="#10141d">
    <meta name="color-scheme" content="dark">

    <title>Daily Prayer</title>

    <style>
        :root {
            --app-background: #10141d;
            --page-background: #fffaf0;
            --page-gap: 12px;
            --page-max-width: 900px;
            --side-space: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
            background: var(--app-background);
            -webkit-text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            overflow-x: auto;
            overflow-y: auto;

            background: var(--app-background);
            color: #ffffff;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overscroll-behavior-y: contain;
        }

        /* PDF document area */
        #pdf-container {
            width: 100%;
            min-width: 100%;
            min-height: 100vh;

            margin: 0 auto;

            padding:
                max(8px, env(safe-area-inset-top))
                var(--side-space)
                max(90px, env(safe-area-inset-bottom));
        }

        /* Individual PDF page */
        .pdf-page {
            position: relative;

            width: 100%;
            max-width: var(--page-max-width);

            margin: 0 auto var(--page-gap);

            overflow: hidden;

            background: var(--page-background);

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.28),
                0 0 0 1px rgba(255, 255, 255, 0.05);

            contain: layout paint;
            transform-origin: top center;
        }

        .pdf-page:last-child {
            margin-bottom: 0;
        }

        .pdf-page canvas {
            display: block;

            width: 100%;
            height: 100%;

            background: var(--page-background);

            opacity: 0;
            transition: opacity 180ms ease;
        }

        .pdf-page.rendered canvas {
            opacity: 1;
        }

        /* Loading placeholder for every page */
        .page-placeholder {
            position: absolute;
            inset: 0;
            z-index: 1;

            overflow: hidden;

            background: var(--page-background);
            transition: opacity 180ms ease;
        }

        .page-placeholder::after {
            content: "";

            position: absolute;
            inset: 0;

            transform: translateX(-100%);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.52),
                    transparent
                );

            animation: page-shimmer 1.3s infinite;
        }

        .pdf-page.rendered .page-placeholder {
            pointer-events: none;
            opacity: 0;
        }

        @keyframes page-shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        /* Main loading screen */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background: var(--app-background);

            transition:
                opacity 220ms ease,
                visibility 220ms ease;
        }

        #loading-screen.hidden {
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 16px;

            text-align: center;
        }

        .spinner {
            width: 42px;
            height: 42px;

            border: 4px solid rgba(255, 255, 255, 0.16);
            border-top-color: #19b7a5;
            border-radius: 50%;

            animation: spin 800ms linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loading-text {
            color: rgba(255, 255, 255, 0.82);

            font-size: 14px;
            line-height: 1.5;
        }

        /* Error screen */
        #error-screen {
            display: none;

            min-height: 100vh;
            min-height: 100dvh;

            align-items: center;
            justify-content: center;

            padding: 24px;

            background: var(--app-background);
        }

        #error-screen.visible {
            display: flex;
        }

        .error-card {
            width: min(100%, 420px);

            padding: 24px;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;

            background: rgba(255, 255, 255, 0.06);

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.28);

            text-align: center;
        }

        .error-icon {
            margin-bottom: 12px;
            font-size: 34px;
        }

        .error-title {
            margin-bottom: 8px;

            font-size: 18px;
            font-weight: 700;
        }

        .error-message {
            color: rgba(255, 255, 255, 0.72);

            font-size: 13px;
            line-height: 1.6;

            overflow-wrap: anywhere;
        }

        .retry-button {
            margin-top: 18px;
            padding: 11px 20px;

            border: 0;
            border-radius: 999px;

            background: #19b7a5;
            color: #07120f;

            font: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .retry-button:active {
            transform: scale(0.97);
        }

        /* Zoom controls */
        #zoom-controls {
            position: fixed;

            right: max(14px, env(safe-area-inset-right));
            bottom: max(18px, env(safe-area-inset-bottom));

            z-index: 9000;

            display: flex;
            align-items: center;
            gap: 7px;

            padding: 7px;

            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;

            background: rgba(24, 30, 41, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 8px 26px rgba(0, 0, 0, 0.36);
        }

        .zoom-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 42px;
            height: 42px;

            border: 0;
            border-radius: 13px;

            background: rgba(255, 255, 255, 0.09);
            color: #ffffff;

            font-family: inherit;
            font-size: 22px;
            font-weight: 600;

            cursor: pointer;
            touch-action: manipulation;
        }

        .zoom-button:active {
            transform: scale(0.93);
            background: rgba(255, 255, 255, 0.16);
        }

        #zoom-reset {
            min-width: 58px;
            padding: 0 10px;

            font-size: 12px;
            font-weight: 700;
        }

        #zoom-level {
            min-width: 48px;

            color: rgba(255, 255, 255, 0.82);

            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        noscript {
            display: block;

            padding: 30px 20px;

            color: white;
            text-align: center;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (min-width: 768px) {
            :root {
                --page-gap: 16px;
                --side-space: 14px;
            }

            #pdf-container {
                padding-top: 14px;
                padding-bottom: 100px;
            }
        }
    </style>
</head>

<body>

    <!-- Loading screen -->
    <div
        id="loading-screen"
        role="status"
        aria-live="polite"
    >
        <div class="loader-content">
            <div
                class="spinner"
                aria-hidden="true"
            ></div>

            <div id="loading-text">
                Loading your prayer note...
            </div>
        </div>
    </div>

    <!-- Rendered PDF pages -->
    <main
        id="pdf-container"
        aria-label="Daily Prayer document"
    ></main>

    <!-- Zoom controls -->
    <div
        id="zoom-controls"
        aria-label="Document zoom controls"
    >
        <button
            type="button"
            class="zoom-button"
            id="zoom-out"
            aria-label="Zoom out"
        >
            −
        </button>

        <div id="zoom-level">100%</div>

        <button
            type="button"
            class="zoom-button"
            id="zoom-in"
            aria-label="Zoom in"
        >
            +
        </button>

        <button
            type="button"
            class="zoom-button"
            id="zoom-reset"
            aria-label="Reset zoom"
        >
            Reset
        </button>
    </div>

    <!-- Error screen -->
    <section
        id="error-screen"
        role="alert"
    >
        <div class="error-card">
            <div
                class="error-icon"
                aria-hidden="true"
            >
                ⚠️
            </div>

            <div class="error-title">
                Unable to open the document
            </div>

            <div
                class="error-message"
                id="error-message"
            >
                Please check the required document files.
            </div>

            <button
                type="button"
                class="retry-button"
                onclick="window.location.reload()"
            >
                Try Again
            </button>
        </div>
    </section>

    <noscript>
        JavaScript must be enabled to view this document.
    </noscript>

    <script type="module">
        "use strict";

        /*
         * Required folder structure:
         *
         * public/
         * └── documents/
         *     ├── index.html
         *     ├── prayer-note.pdf
         *     └── pdfjs/
         *         ├── pdf.mjs
         *         └── pdf.worker.mjs
         */

        const BASE_PATH = "/documents/";

        const PDF_URL =
            `${BASE_PATH}prayer-note.pdf?v=2`;

        const PDFJS_MODULE_URL =
            `${BASE_PATH}pdfjs/pdf.mjs?v=2`;

        const PDFJS_WORKER_URL =
            `${BASE_PATH}pdfjs/pdf.worker.mjs?v=2`;

        /*
         * Higher value improves text quality on modern phones.
         * Value is limited to prevent excessive Android WebView memory use.
         */
        const MAX_PIXEL_RATIO = 3;
        const QUALITY_MULTIPLIER = 1.25;

        const MIN_ZOOM = 1;
        const MAX_ZOOM = 2.5;
        const ZOOM_STEP = 0.25;

        const OBSERVER_MARGIN = "180% 0px";

        const container =
            document.getElementById("pdf-container");

        const loadingScreen =
            document.getElementById("loading-screen");

        const loadingText =
            document.getElementById("loading-text");

        const errorScreen =
            document.getElementById("error-screen");

        const errorMessage =
            document.getElementById("error-message");

        const zoomOutButton =
            document.getElementById("zoom-out");

        const zoomInButton =
            document.getElementById("zoom-in");

        const zoomResetButton =
            document.getElementById("zoom-reset");

        const zoomLevelText =
            document.getElementById("zoom-level");

        let pdfDocument = null;
        let pageObserver = null;

        let zoomLevel = 1;
        let basePageWidth = 0;

        let pinchStartDistance = 0;
        let pinchStartZoom = 1;
        let zoomRenderTimer = null;

        const renderedPages = new Set();
        const renderingPages = new Set();

        function updateLoadingText(message) {
            loadingText.textContent = message;
        }

        function hideLoadingScreen() {
            loadingScreen.classList.add("hidden");
        }

        function showError(error) {
            console.error("PDF Viewer Error:", error);

            hideLoadingScreen();

            container.hidden = true;
            document.getElementById("zoom-controls").hidden = true;

            errorScreen.classList.add("visible");

            let message =
                "The PDF or PDF.js files could not be loaded.";

            if (error instanceof Error && error.message) {
                message += ` Error: ${error.message}`;
            }

            errorMessage.textContent = message;
        }

        function getAvailablePageWidth() {
            const containerStyle =
                window.getComputedStyle(container);

            const leftPadding =
                parseFloat(containerStyle.paddingLeft) || 0;

            const rightPadding =
                parseFloat(containerStyle.paddingRight) || 0;

            return Math.max(
                280,
                Math.min(
                    900,
                    window.innerWidth -
                    leftPadding -
                    rightPadding
                )
            );
        }

        function updateZoomDisplay() {
            zoomLevelText.textContent =
                `${Math.round(zoomLevel * 100)}%`;

            zoomOutButton.disabled =
                zoomLevel <= MIN_ZOOM;

            zoomInButton.disabled =
                zoomLevel >= MAX_ZOOM;

            zoomOutButton.style.opacity =
                zoomOutButton.disabled ? "0.4" : "1";

            zoomInButton.style.opacity =
                zoomInButton.disabled ? "0.4" : "1";
        }

        function applyPageWidths() {
            const pages =
                document.querySelectorAll(".pdf-page");

            const newWidth =
                basePageWidth * zoomLevel;

            for (const pageElement of pages) {
                pageElement.style.width =
                    `${newWidth}px`;

                pageElement.style.maxWidth =
                    "none";
            }

            container.style.minWidth =
                `${Math.max(window.innerWidth, newWidth + 16)}px`;
        }

        function scheduleSharpRerender() {
            window.clearTimeout(zoomRenderTimer);

            zoomRenderTimer = window.setTimeout(
                () => {
                    void rerenderVisiblePages();
                },
                180
            );
        }

        function setZoom(nextZoom) {
            zoomLevel =
                Math.min(
                    MAX_ZOOM,
                    Math.max(MIN_ZOOM, nextZoom)
                );

            applyPageWidths();
            updateZoomDisplay();
            scheduleSharpRerender();
        }

        async function rerenderVisiblePages() {
            const pages =
                [...document.querySelectorAll(".pdf-page")];

            for (const pageElement of pages) {
                const rect =
                    pageElement.getBoundingClientRect();

                const isNearViewport =
                    rect.bottom >= -window.innerHeight &&
                    rect.top <= window.innerHeight * 2;

                if (!isNearViewport) {
                    continue;
                }

                const pageNumber =
                    Number(pageElement.dataset.pageNumber);

                renderedPages.delete(pageNumber);
                pageElement.classList.remove("rendered");

                await renderPage(pageElement);
            }
        }

        async function createPagePlaceholders() {
            const fragment =
                document.createDocumentFragment();

            basePageWidth =
                getAvailablePageWidth();

            for (
                let pageNumber = 1;
                pageNumber <= pdfDocument.numPages;
                pageNumber++
            ) {
                const page =
                    await pdfDocument.getPage(pageNumber);

                const baseViewport =
                    page.getViewport({ scale: 1 });

                const pageElement =
                    document.createElement("section");

                pageElement.className = "pdf-page";

                pageElement.dataset.pageNumber =
                    String(pageNumber);

                pageElement.style.aspectRatio =
                    `${baseViewport.width} / ${baseViewport.height}`;

                pageElement.style.width =
                    `${basePageWidth}px`;

                const placeholder =
                    document.createElement("div");

                placeholder.className =
                    "page-placeholder";

                placeholder.setAttribute(
                    "aria-hidden",
                    "true"
                );

                const canvas =
                    document.createElement("canvas");

                canvas.setAttribute(
                    "aria-label",
                    `Document page ${pageNumber}`
                );

                pageElement.append(
                    placeholder,
                    canvas
                );

                fragment.appendChild(pageElement);

                page.cleanup();
            }

            container.replaceChildren(fragment);

            applyPageWidths();
        }

        async function renderPage(pageElement) {
            const pageNumber =
                Number(pageElement.dataset.pageNumber);

            if (
                renderedPages.has(pageNumber) ||
                renderingPages.has(pageNumber)
            ) {
                return;
            }

            renderingPages.add(pageNumber);

            try {
                const page =
                    await pdfDocument.getPage(pageNumber);

                const canvas =
                    pageElement.querySelector("canvas");

                const context =
                    canvas.getContext("2d", {
                        alpha: false,
                        desynchronized: true
                    });

                if (!context) {
                    throw new Error(
                        `Canvas context unavailable on page ${pageNumber}.`
                    );
                }

                const baseViewport =
                    page.getViewport({ scale: 1 });

                const cssWidth =
                    Math.max(
                        1,
                        pageElement.clientWidth
                    );

                const cssScale =
                    cssWidth / baseViewport.width;

                const deviceRatio =
                    window.devicePixelRatio || 1;

                const pixelRatio =
                    Math.min(
                        deviceRatio * QUALITY_MULTIPLIER,
                        MAX_PIXEL_RATIO
                    );

                const renderScale =
                    cssScale * pixelRatio;

                const renderViewport =
                    page.getViewport({
                        scale: renderScale
                    });

                const cssHeight =
                    baseViewport.height * cssScale;

                canvas.width =
                    Math.max(
                        1,
                        Math.floor(renderViewport.width)
                    );

                canvas.height =
                    Math.max(
                        1,
                        Math.floor(renderViewport.height)
                    );

                canvas.style.width =
                    `${Math.round(cssWidth)}px`;

                canvas.style.height =
                    `${Math.round(cssHeight)}px`;

                await page.render({
                    canvasContext: context,
                    viewport: renderViewport,
                    background: "rgb(255, 250, 240)"
                }).promise;

                renderedPages.add(pageNumber);
                pageElement.classList.add("rendered");

                page.cleanup();

                if (pageNumber === 1) {
                    hideLoadingScreen();
                }
            } catch (error) {
                console.error(
                    `Page ${pageNumber} rendering failed:`,
                    error
                );

                pageElement.innerHTML = `
                    <div
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            width:100%;
                            height:100%;
                            padding:20px;
                            background:#fffaf0;
                            color:#5b2424;
                            font:600 14px system-ui,sans-serif;
                            text-align:center;
                        "
                    >
                        Page ${pageNumber} could not be displayed.
                    </div>
                `;
            } finally {
                renderingPages.delete(pageNumber);
            }
        }

        function setupLazyRendering() {
            const pageElements =
                [...document.querySelectorAll(".pdf-page")];

            if (!("IntersectionObserver" in window)) {
                void renderPagesSequentially(pageElements);
                return;
            }

            pageObserver =
                new IntersectionObserver(
                    entries => {
                        for (const entry of entries) {
                            if (!entry.isIntersecting) {
                                continue;
                            }

                            const pageElement =
                                entry.target;

                            void renderPage(pageElement);

                            pageObserver.unobserve(
                                pageElement
                            );
                        }
                    },
                    {
                        root: null,
                        rootMargin: OBSERVER_MARGIN,
                        threshold: 0.01
                    }
                );

            for (const pageElement of pageElements) {
                pageObserver.observe(pageElement);
            }
        }

        async function renderPagesSequentially(pageElements) {
            for (const pageElement of pageElements) {
                await renderPage(pageElement);
            }
        }

        function getTouchDistance(touchOne, touchTwo) {
            const deltaX =
                touchTwo.clientX - touchOne.clientX;

            const deltaY =
                touchTwo.clientY - touchOne.clientY;

            return Math.hypot(deltaX, deltaY);
        }

        function setupZoomControls() {
            zoomInButton.addEventListener(
                "click",
                () => {
                    setZoom(zoomLevel + ZOOM_STEP);
                }
            );

            zoomOutButton.addEventListener(
                "click",
                () => {
                    setZoom(zoomLevel - ZOOM_STEP);
                }
            );

            zoomResetButton.addEventListener(
                "click",
                () => {
                    setZoom(1);
                    window.scrollTo({
                        left: 0,
                        behavior: "smooth"
                    });
                }
            );

            container.addEventListener(
                "touchstart",
                event => {
                    if (event.touches.length !== 2) {
                        return;
                    }

                    pinchStartDistance =
                        getTouchDistance(
                            event.touches[0],
                            event.touches[1]
                        );

                    pinchStartZoom =
                        zoomLevel;
                },
                {
                    passive: true
                }
            );

            container.addEventListener(
                "touchmove",
                event => {
                    if (
                        event.touches.length !== 2 ||
                        pinchStartDistance <= 0
                    ) {
                        return;
                    }

                    const currentDistance =
                        getTouchDistance(
                            event.touches[0],
                            event.touches[1]
                        );

                    const scaleChange =
                        currentDistance /
                        pinchStartDistance;

                    setZoom(
                        pinchStartZoom * scaleChange
                    );
                },
                {
                    passive: true
                }
            );

            container.addEventListener(
                "touchend",
                event => {
                    if (event.touches.length < 2) {
                        pinchStartDistance = 0;
                        scheduleSharpRerender();
                    }
                },
                {
                    passive: true
                }
            );

            updateZoomDisplay();
        }

        async function startViewer() {
            try {
                updateLoadingText(
                    "Loading PDF engine..."
                );

                const pdfjsLib =
                    await import(PDFJS_MODULE_URL);

                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    PDFJS_WORKER_URL;

                updateLoadingText(
                    "Loading your prayer note..."
                );

                const loadingTask =
                    pdfjsLib.getDocument({
                        url: PDF_URL,
                        useSystemFonts: true,
                        disableRange: false,
                        disableStream: false,
                        disableAutoFetch: false
                    });

                loadingTask.onProgress =
                    progress => {
                        if (
                            !progress.total ||
                            progress.total <= 0
                        ) {
                            return;
                        }

                        const percent =
                            Math.min(
                                100,
                                Math.round(
                                    (
                                        progress.loaded /
                                        progress.total
                                    ) * 100
                                )
                            );

                        updateLoadingText(
                            `Loading your prayer note... ${percent}%`
                        );
                    };

                pdfDocument =
                    await loadingTask.promise;

                updateLoadingText(
                    `Preparing ${pdfDocument.numPages} pages...`
                );

                await createPagePlaceholders();

                const firstPage =
                    document.querySelector(
                        '.pdf-page[data-page-number="1"]'
                    );

                if (!firstPage) {
                    throw new Error(
                        "The first document page could not be created."
                    );
                }

                await renderPage(firstPage);

                setupLazyRendering();
                setupZoomControls();
            } catch (error) {
                showError(error);
            }
        }

        window.addEventListener(
            "pageshow",
            event => {
                if (
                    event.persisted &&
                    renderedPages.size === 0
                ) {
                    window.location.reload();
                }
            }
        );

        window.addEventListener(
            "resize",
            () => {
                if (
                    zoomLevel !== 1 ||
                    !pdfDocument
                ) {
                    return;
                }

                basePageWidth =
                    getAvailablePageWidth();

                applyPageWidths();
                scheduleSharpRerender();
            }
        );

        void startViewer();
    </script>

</body>
</html>
