<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Bhavix-Site</title> 

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    height:100%;
    overflow:hidden;
} 
    
body{
    width:100%;
    height:100%;
    background:linear-gradient(135deg,#141e30,#243b55);
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
    position:relative;
}

/* Fixed Background Container to prevent stars from sticking to the top */
.background-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none; /* Inactive to clicks so it doesn't block the button */
    overflow: hidden;
}

/* Floating Emoji Stars */
.star-emoji{
    position:absolute;
    font-size:22px;
    opacity:0.85;
    animation:float 6s infinite ease-in-out;
}

/* Tiny dynamic stars/snowflakes */
.tiny-star {
    position: absolute;
    background-color: #ffffff;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    animation: shimmer infinite ease-in-out;
}

@keyframes float{
    0% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(15deg); }
    100% { transform: translateY(0px) rotate(0deg); }
}

@keyframes shimmer {
    0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.3;
    }
    50% {
        transform: translateY(-15px) scale(1.2);
        opacity: 1;
    }
}

/* Card centering */
.card{
    position:relative;
    z-index:2;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:60px 35px;
    border-radius:30px;
    text-align:center;
    width:90%;
    max-width:420px;
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
    animation:fadeUp 1.2s ease;
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    font-size:1.6rem;
    font-weight:700;
    margin-bottom:45px;
    letter-spacing:0.5px;
    white-space:nowrap;
}

/* Button */
.start-btn{
    padding:15px 40px;
    font-size:1rem;
    font-weight:600;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:linear-gradient(45deg,#ff9966,#ff5e62);
    color:white;
    box-shadow:0 10px 30px rgba(255,94,98,0.5);
    transition:0.3s;
    touch-action: manipulation;
}

.start-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 40px rgba(255,94,98,0.7);
}

.start-btn:active{
    transform:scale(0.96);
}
</style>
</head>

<body>

<!-- All Stars & Snow elements are now in this isolated fixed background layer -->
<div class="background-container" id="bgContainer">
    <!-- Manual Emoji Stars positioned safely relative to the screen -->
    <div class="star-emoji" style="top:10%; left:15%;">🌟</div>
    <div class="star-emoji" style="top:25%; right:12%; animation-delay:1s;">🌟</div>
    <div class="star-emoji" style="bottom:18%; left:15%; animation-delay:2s;">🌟</div>
    <div class="star-emoji" style="bottom:28%; right:15%; animation-delay:3s;">🌟</div>
    <div class="star-emoji" style="top:52%; left:8%; animation-delay:1.5s;">🌟</div>
    <div class="star-emoji" style="top:62%; right:8%; animation-delay:2.5s;">🌟</div>
</div>

<div class="card">
    <h1>Special Countdown ✨</h1>
    <button class="start-btn" id="startBtn">Start</button>
</div>

<script>
const btn = document.getElementById("startBtn");

btn.addEventListener("click", ()=>{
    window.location.href = "https://bhavix-site.web.app/countdown/";
});

// Dynamic tiny stars/snow generator for fully organic distribution
function generateSnowfield() {
    const container = document.getElementById('bgContainer');
    const starCount = 35; // Ideal quantity for mobile webview performance

    for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.classList.add('tiny-star');
        
        // Randomly scatter positions across the viewport 100% safely
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        
        // Varying sizes to create depth (like snowfall in screenshots)
        const size = Math.random() * 3 + 1.5;
        const opacity = Math.random() * 0.7 + 0.3;
        const delay = Math.random() * 5;
        const duration = Math.random() * 4 + 4; // Floating speed (4s - 8s)
        
        star.style.left = `${x}%`;
        star.style.top = `${y}%`;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.opacity = opacity;
        star.style.animationDelay = `${delay}s`;
        star.style.animationDuration = `${duration}s`;
        
        container.appendChild(star);
    }
}

// Initialize stars generation on load
window.addEventListener('DOMContentLoaded', generateSnowfield);
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js")
    .then(() => console.log("Homepage SW Registered"));
}
</script>

<script>
function fixViewportHeight() {
    document.body.style.height = window.innerHeight + "px";
}

window.addEventListener("load", fixViewportHeight);
window.addEventListener("resize", fixViewportHeight);
</script>    

</body>
</html>
