<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Just for you · WebLock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;font-family:Inter,sans-serif;background:#080808;color:#f3f3f3;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;background:radial-gradient(ellipse at 50% 46%,#191919 0, #080808 57%);-webkit-font-smoothing:antialiased}
.page{min-height:100vh;min-height:100svh;display:grid;grid-template-rows:1fr auto 1fr;padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));overflow:hidden}
header{align-self:start;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:12px;color:#999}
.brand{display:flex;align-items:center;gap:9px;font-weight:500;color:#ddd}.brand svg{width:19px;height:19px}.edition{font-size:9px;letter-spacing:.18em;text-transform:uppercase}
main{text-align:center;width:100%;max-width:440px;margin:auto;padding:36px 0}
.eyebrow{font-size:10px;letter-spacing:.28em;color:#777;text-transform:uppercase;margin:0 0 27px}h1{font-size:clamp(29px,7vw,38px);font-weight:500;letter-spacing:-1.6px;margin:0 0 10px;line-height:1.2}.subtitle{font-size:13px;line-height:1.8;color:#888;margin:0}
.control{position:relative;margin:52px auto 36px;width:248px;height:132px;max-width:100%}.halo{position:absolute;inset:-45px;background:radial-gradient(ellipse,#fff2,transparent 67%);opacity:0;transition:opacity .5s;pointer-events:none}.control[data-open=true] .halo{opacity:1}
.switch{display:block;position:relative;width:100%;height:100%;padding:10px;border:1px solid #3c3c3c;border-radius:80px;background:linear-gradient(155deg,#252525,#101010);box-shadow:inset 0 2px 8px #0009,0 20px 60px #0006;cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent;transition:background .35s,box-shadow .35s,border-color .35s}
.switch[aria-checked=true]{background:linear-gradient(140deg,#fff,#cecece);border-color:#fff;box-shadow:0 0 35px #ffffff1a,0 0 85px #ffffff10,inset 0 1px 1px #fff}.switch:focus-visible{outline:2px solid #fff;outline-offset:9px}.switch:disabled{cursor:wait}.switch[aria-busy=true]{opacity:.65}
.thumb{position:absolute;top:9px;left:9px;width:112px;height:112px;border:1px solid #555;border-radius:50%;background:linear-gradient(145deg,#424242,#202020);display:grid;place-items:center;box-shadow:0 5px 12px #0006,inset 0 1px 1px #ffffff20;transition:transform .35s cubic-bezier(.22,.7,.25,1),background .35s;color:#aaa;pointer-events:none}
.switch[aria-checked=true] .thumb{transform:translateX(116px);background:linear-gradient(145deg,#fff,#e6e6e6);border-color:#fff;box-shadow:0 4px 13px #0003,inset 0 1px 2px white;color:#191919}.thumb svg{width:28px;height:28px}.track-label{position:absolute;top:50%;right:32px;transform:translateY(-50%);font:600 11px Inter,sans-serif;letter-spacing:.12em;color:#777;pointer-events:none}.switch[aria-checked=true] .track-label{left:32px;right:auto;color:#666}
.legend{display:flex;justify-content:center;align-items:center;gap:8px;font-size:11px;letter-spacing:.02em;color:#aaa;min-height:20px}.dot{width:5px;height:5px;border-radius:50%;background:#777}.control[data-open=true]~.legend .dot{background:#fff;box-shadow:0 0 9px #fff8}.hint{font-size:11px;color:#555;margin:16px 0 0}.message{font-size:12px;line-height:1.7;color:#aaa;min-height:41px;margin:18px auto 0;max-width:320px}.retry{color:#ddd;background:none;border:0;text-decoration:underline;font:inherit;cursor:pointer;padding:8px}
footer{align-self:end;text-align:center;color:#555;font-size:10px;line-height:1.8;letter-spacing:.02em}.heart{display:block;color:#aaa;font-size:18px;margin-bottom:12px}.rule{height:1px;width:32px;background:#333;margin:0 auto 15px}
@media(max-height:640px){main{padding:25px 0}.control{margin:28px auto}.page{padding-top:20px;padding-bottom:20px}.eyebrow{margin-bottom:18px}footer .heart{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<div class="page">
<header><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="18" rx="5"/><path d="m7 9 2.5 7 2.5-5 2.5 5L17 9"/></svg>WebLock</div><span class="edition">A little control. Just for you.</span></header>
<main>
<p class="eyebrow">In your hands</p>
<h1 id="title">Getting ready…</h1>
<p class="subtitle" id="subtitle">One little switch. Your call.</p>
<div class="control" id="control" data-open="false"><div class="halo"></div>
<button class="switch" id="switch" type="button" role="switch" aria-label="App access" aria-checked="false" aria-describedby="hint message" disabled>
<span class="track-label" id="track">···</span><span class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v8M7 5.5a8 8 0 1 0 10 0"/></svg></span>
</button></div>
<div class="legend" role="status"><span class="dot"></span><span id="connection">Connecting to WebLock</span></div>
<p class="hint" id="hint">Tap to switch · swipe right to open</p>
<p class="message" id="message" aria-live="polite"></p>
<button class="retry" id="retry" hidden onclick="location.reload()">Try again</button>
</main>
<footer><span class="heart" aria-hidden="true">♡</span><div class="rule"></div>A little space, whenever you want it.</footer>
</div>
<script>
window.sdkWatchdog = setTimeout(() => {
 document.getElementById('title').textContent='Unable to connect';
 document.getElementById('message').textContent='Check your internet connection and try again.';
 document.getElementById('retry').hidden=false;
},15000);
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import {getDatabase,ref,onValue,update} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
const app=initializeApp({apiKey:'AIzaSyBYsiWoEOWJ35sVAIdwj1tlLzmpSEyaE5o',authDomain:'bhavix-site.firebaseapp.com',databaseURL:'https://bhavix-site-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'bhavix-site',appId:'1:973089920463:web:dd47c817434a852a56eeba'});
const db=getDatabase(app),settingRef=ref(db,'settings');
const $=id=>document.getElementById(id),button=$('switch');
let connected=false,ready=false,busy=false,maintenance=true,failed=false;
function render(){
 const open=ready&&!maintenance;
 button.disabled=!connected||!ready||busy||failed;
 button.setAttribute('aria-checked',String(open));
 button.setAttribute('aria-busy',String(busy));
 $('control').dataset.open=String(open);
 $('track').textContent=ready?(open?'ON':'OFF'):'···';
 $('title').textContent=failed?'Unable to connect':!ready?'Getting ready…':open?'App is Open':'App is Closed';
 $('subtitle').textContent=!ready?'One little switch. Your call.':open?'A little freedom. With your say-so.':'A little pause. Just like that.';
 $('connection').textContent=busy?'Saving your choice…':!connected?'Waiting for connection':!ready?'Loading current setting':maintenance?'Maintenance is on':'Maintenance is off';
}
onValue(ref(db,'.info/connected'),snapshot=>{connected=snapshot.val()===true;render();});
onValue(settingRef,snapshot=>{
 clearTimeout(window.sdkWatchdog);
 const settings=snapshot.val();
 if(!settings||typeof settings!=='object'){
  ready=false;failed=true;$('message').textContent='WebLock settings are not configured yet.';render();return;
 }
 maintenance=!!settings.maintenance;ready=true;failed=false;$('retry').hidden=true;render();
},()=>{
 clearTimeout(window.sdkWatchdog);ready=false;failed=true;
 $('message').textContent='Unable to read WebLock settings. Please check access permissions.';
 $('retry').hidden=false;render();
});
async function setOpen(open){
 if(button.disabled||open===!maintenance)return;
 busy=true;$('message').textContent='';render();
 const slow=setTimeout(()=>{$('message').textContent='Still waiting for confirmation. Keep this page open.';},10000);
 try{
  // Change only maintenance. Preserve PIN, notice, hint and all other settings.
  await update(settingRef,{maintenance:!open});
  $('message').textContent=open?'All set. WebLock is open.':'All set. WebLock is in maintenance mode.';
 }catch(error){
  $('message').textContent='Could not save your choice. Check your connection or Firebase write permissions.';
 }finally{clearTimeout(slow);busy=false;render();}
}
let gesture=null,suppressClick=false;
button.addEventListener('pointerdown',event=>{
 if(button.disabled||!event.isPrimary||event.button!==0)return;
 gesture={x:event.clientX,y:event.clientY,id:event.pointerId};suppressClick=false;
 button.setPointerCapture(event.pointerId);
});
button.addEventListener('pointerup',event=>{
 if(!gesture||gesture.id!==event.pointerId)return;
 const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;gesture=null;
 if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)){
  suppressClick=true;setOpen(dx>0);
 }
});
button.addEventListener('pointercancel',()=>{gesture=null;suppressClick=false;});
button.addEventListener('click',event=>{
 if(suppressClick&&event.detail!==0){suppressClick=false;return;}
 suppressClick=false;setOpen(maintenance);
});
button.addEventListener('keydown',event=>{
 if(event.key==='ArrowRight'||event.key==='ArrowLeft'){
  event.preventDefault();setOpen(event.key==='ArrowRight');
 }
});
render();
</script>
</body>
</html>
