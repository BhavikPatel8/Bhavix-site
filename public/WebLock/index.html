
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0f172a">
<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>webLock Access</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;
    min-height:100dvh;

    display:flex;
    justify-content:center;
    align-items:center;

    background-color:#0f172a;
    background-image:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b,
            #334155
        );

    padding-left:20px;
    padding-right:20px;
    padding-bottom:20px;

    /* Status Bar Safe Area */
    padding-top:calc(env(safe-area-inset-top, 0px) + 20px);

    position:relative;

    overflow-x:hidden;
    overflow-y:auto;
}

/* Floating Glow */
body::before{
    content:'';

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:min(500px,80vw);
    height:min(500px,80vw);

    background:rgba(255,255,255,0.05);

    border-radius:50%;

    filter:blur(120px);

    pointer-events:none;

    z-index:0;
}

.container{

    position:relative;
    z-index:1;

    width:100%;
    max-width:380px;

    padding:35px;

    border-radius:24px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.35),
        0 0 30px rgba(255,255,255,0.05);

    text-align:center;
}

h2{
    color:#ffffff;
    margin-bottom:8px;
    font-weight:600;
}

.subtitle{
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:25px;
}

/* Pattern Display */
.pattern-display{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:30px;
    height:50px;
}

.pattern-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:rgba(255,255,255,0.3);
    border:1px solid rgba(255,255,255,0.5);
    transition:all 0.3s ease;
}

.pattern-dot.filled{
    background:rgba(96,165,250,0.8);
    border:1px solid rgba(96,165,250,1);
    box-shadow:0 0 10px rgba(96,165,250,0.6);
}

/* Number Pad */
.number-pad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.number-btn{
    width:100%;
    aspect-ratio:1;

    padding:0;

    border:1px solid rgba(255,255,255,0.2);
    border-radius:14px;

    background:rgba(255,255,255,0.08);

    color:#ffffff;

    font-size:20px;
    font-weight:600;

    cursor:pointer;

    transition:all 0.2s ease;

    display:flex;
    justify-content:center;
    align-items:center;

    outline:none;
}

.number-btn:hover{
    background:rgba(255,255,255,0.12);
    border-color:rgba(255,255,255,0.3);
}

.number-btn:active{
    transform:scale(0.95);
    background:rgba(96,165,250,0.3);
    border-color:rgba(96,165,250,0.6);
}

/* Action Buttons */
.action-buttons{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.action-btn{
    flex:1;

    padding:12px;

    border:1px solid rgba(255,255,255,0.2);
    border-radius:12px;

    background:rgba(255,255,255,0.08);

    color:#ffffff;

    font-size:14px;
    font-weight:500;

    cursor:pointer;

    transition:all 0.2s ease;

    outline:none;
}

.action-btn:hover{
    background:rgba(255,255,255,0.12);
    border-color:rgba(255,255,255,0.3);
}

.action-btn:active{
    transform:scale(0.98);
}

.clear-btn:active{
    background:rgba(239,68,68,0.3);
}

.submit-btn:active{
    background:rgba(96,165,250,0.3);
}

#error{
    margin-top:15px;
    color:#ff9f9f;
    font-size:14px;
    min-height:20px;
    transition:all 0.3s ease;
}

.success{
    color:#7CFF9E !important;
}

.shake{
    animation:shake 0.5s ease;
}

@keyframes shake{
    0%, 100% { transform:translateX(0); }
    25% { transform:translateX(-5px); }
    75% { transform:translateX(5px); }
}

@media (max-width:480px){

    body{
        padding:16px;
    }

    .container{
        padding:24px;
        max-width:100%;
    }

    .number-btn{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h2>webLock</h2>
    <p class="subtitle">Enter Pattern to Unlock 🔒</p>

    <!-- Pattern Display -->
    <div class="pattern-display">
        <div class="pattern-dot"></div>
        <div class="pattern-dot"></div>
        <div class="pattern-dot"></div>
        <div class="pattern-dot"></div>
    </div>

    <!-- Number Pad -->
    <div class="number-pad">
        <button class="number-btn" onclick="addToPattern('1')">1</button>
        <button class="number-btn" onclick="addToPattern('2')">2</button>
        <button class="number-btn" onclick="addToPattern('3')">3</button>
        <button class="number-btn" onclick="addToPattern('4')">4</button>
        <button class="number-btn" onclick="addToPattern('5')">5</button>
        <button class="number-btn" onclick="addToPattern('6')">6</button>
        <button class="number-btn" onclick="addToPattern('7')">7</button>
        <button class="number-btn" onclick="addToPattern('8')">8</button>
        <button class="number-btn" onclick="addToPattern('9')">9</button>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="action-btn clear-btn" onclick="clearPattern()">Clear</button>
        <button class="action-btn submit-btn" onclick="checkPattern()">Unlock</button>
    </div>

    <p id="error"></p>
</div>

<script>

let pattern = [];
const correctPattern = ['1', '2', '3', '4'];
const patternDots = document.querySelectorAll('.pattern-dot');
const errorMsg = document.getElementById("error");

function addToPattern(num){
    if(pattern.length < 4){
        pattern.push(num);
        updatePatternDisplay();

        // Auto-check if pattern is complete
        if(pattern.length === 4){
            setTimeout(checkPattern, 300);
        }
    }
}

function updatePatternDisplay(){
    patternDots.forEach((dot, index)=>{
        if(index < pattern.length){
            dot.classList.add('filled');
        }else{
            dot.classList.remove('filled');
        }
    });
}

function clearPattern(){
    pattern = [];
    updatePatternDisplay();
    errorMsg.innerHTML = '';
    errorMsg.className = '';
}

function checkPattern(){
    const patternString = pattern.join('');
    const correctString = correctPattern.join('');

    if(patternString === correctString){
        errorMsg.className = "success";
        errorMsg.innerHTML = "Access Granted ✨";

        // Disable all buttons
        document.querySelectorAll('.number-btn, .action-btn').forEach(btn=>{
            btn.disabled = true;
        });

        setTimeout(()=>{
            window.open(
                "https://bhavix-site.web.app",
                "_self"
            );
        }, 1000);

    }else{
        errorMsg.className = "";
        errorMsg.innerHTML = "Incorrect Pattern 💔";

        // Shake animation
        document.querySelector('.container').classList.add('shake');
        setTimeout(()=>{
            document.querySelector('.container').classList.remove('shake');
        }, 500);

        clearPattern();
    }
}

</script>

</body>
</html>
