<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#0f172a">
    <!-- Adjusted viewport to prevent unwanted zooming on mobile input -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>webLock Access</title>
    <style>
        * {    
            margin: 0;    
            padding: 0;    
            box-sizing: border-box;    
            font-family: 'Segoe UI', sans-serif;    
            -webkit-tap-highlight-color: transparent;
        }

        html {    
            width: 100%;    
            height: 100%;    
            overflow: hidden;    
        }

        body {    
            width: 100%;    
            height: 100%;
            display: flex;    
            justify-content: center;    
            align-items: center;
            background-color: #0f172a;    
            background-image: linear-gradient(135deg, #0f172a, #1e293b, #334155);    
            background-attachment: fixed; 

            padding-top: env(safe-area-inset-top, 20px);    
            padding-bottom: max(env(safe-area-inset-bottom, 0px), 20px);    
            padding-left: max(env(safe-area-inset-left, 0px), 20px);    
            padding-right: max(env(safe-area-inset-right, 0px), 20px);

            position: relative;    
            overflow: hidden;    
            
            /* WebView UI Fix: Prevents text selection on rapid tapping */
            -webkit-user-select: none;
            user-select: none;
        }

        /* Floating Glow */
        body::before {    
            content: '';    
            position: fixed;    
            top: 50%;    
            left: 50%;    
            transform: translate(-50%, -50%);    
            width: min(500px, 80vw);    
            height: min(500px, 80vw);    
            background: rgba(96, 165, 250, 0.08);    
            border-radius: 50%;    
            filter: blur(120px);    
            pointer-events: none;    
            z-index: 0;
        }

        .container {    
            position: relative;    
            z-index: 1;
            width: 100%;    
            max-width: 380px;
            margin: auto;
            padding: 35px;    
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.85);    
            backdrop-filter: blur(20px);    
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);    
            box-shadow:        
                0 15px 40px rgba(0, 0, 0, 0.5),        
                0 0 30px rgba(96, 165, 250, 0.08);
            text-align: center;
        }

        h2 {    
            color: #ffffff;    
            margin-bottom: 8px;    
            font-weight: 600;    
            font-size: 22px;    
            letter-spacing: 0.5px;
        }

        .subtitle {    
            color: #cbd5e1;    
            font-size: 14px;    
            margin-bottom: 25px;
        }

        /* Pattern Display */
        .pattern-display {    
            display: flex;    
            justify-content: center;    
            align-items: center;    
            gap: 12px;    
            margin-bottom: 30px;    
            height: 50px;
        }

        .pattern-dot {    
            width: 14px;    
            height: 14px;    
            border-radius: 50%;    
            background: rgba(255, 255, 255, 0.2);    
            border: 1.5px solid rgba(255, 255, 255, 0.4);    
            transition: all 0.25s ease;
        }

        .pattern-dot.filled {    
            background: rgba(96, 165, 250, 0.9);    
            border-color: rgba(96, 165, 250, 1);    
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.7);    
            transform: scale(1.2);
        }

        /* Number Pad */
        .number-pad {    
            display: grid;    
            grid-template-columns: repeat(3, 1fr);    
            gap: 12px;    
            margin-bottom: 20px;
        }

        .number-btn {    
            width: 100%;    
            aspect-ratio: 1;    
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.18);    
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;    
            font-size: 20px;    
            font-weight: 600;
            cursor: pointer;    
            transition: all 0.15s ease;
            display: flex;    
            justify-content: center;    
            align-items: center;
            outline: none;    
            min-height: 52px;
            
            /* WebView UI Fix: Prevents delay and selection popups */
            touch-action: manipulation;
            -webkit-touch-callout: none;
        }

        .number-btn:active {    
            transform: scale(0.93);    
            background: rgba(96, 165, 250, 0.25);    
            border-color: rgba(96, 165, 250, 0.6);
        }

        /* Action Buttons */
        .action-buttons {    
            display: flex;    
            gap: 10px;    
            margin-bottom: 15px;
        }

        .action-btn {    
            flex: 1;    
            padding: 14px 12px;
            border: 1px solid rgba(255, 255, 255, 0.18);    
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;    
            font-size: 14px;    
            font-weight: 500;
            cursor: pointer;    
            transition: all 0.15s ease;    
            outline: none;
            min-height: 48px;
            
            /* WebView UI Fix: Prevents delay and selection popups */
            touch-action: manipulation;
            -webkit-touch-callout: none;
        }

        .action-btn:active {    
            transform: scale(0.97);
        }

        .clear-btn:active {    
            background: rgba(239, 68, 68, 0.3);    
            border-color: rgba(239, 68, 68, 0.5);
        }

        .submit-btn:active {    
            background: rgba(96, 165, 250, 0.3);    
            border-color: rgba(96, 165, 250, 0.5);
        }

        .submit-btn {    
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.25), rgba(139, 92, 246, 0.25));    
            border-color: rgba(96, 165, 250, 0.4);
        }

        #error {    
            margin-top: 12px;    
            color: #ff9f9f;    
            font-size: 14px;    
            min-height: 22px;    
            transition: all 0.3s ease;
        }

        .success {    
            color: #7cff9e !important;
        }

        /* Shake Animation */
        .shake {    
            animation: shake 0.45s ease;
        }

        @keyframes shake {    
            0%, 100% { transform: translateX(0); }    
            20%       { transform: translateX(-8px); }    
            40%       { transform: translateX(8px); }    
            60%       { transform: translateX(-5px); }    
            80%       { transform: translateX(5px); }
        }

        /* Maintenance UI Styling overrides */
        .maintenance-container {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .maintenance-icon {
            font-size: 48px;
            margin-bottom: 16px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* Responsive Modifications */
        @media (max-width: 400px) {    
            .container {        
                padding: 24px 20px;    
            }    
            .number-btn {        
                font-size: 18px;    
            }
        }

        @media (max-height: 600px) {    
            .pattern-display {        
                margin-bottom: 16px;        
                height: 36px;    
            }    
            .number-pad {        
                gap: 8px;        
                margin-bottom: 12px;    
            }    
            .container {        
                padding: 20px;    
            }    
            h2 {        
                margin-bottom: 4px;    
            }    
            .subtitle {        
                margin-bottom: 14px;    
            }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">    
    <!-- Standard Lock Screen Interface View Wrapper -->
    <div id="lockInterface">
        <h2>webLock 🔐</h2>    
        <p class="subtitle" id="hintLine">Connecting to system...</p>

        <!-- Pattern Display -->    
        <div class="pattern-display">        
            <div class="pattern-dot"></div>        
            <div class="pattern-dot"></div>        
            <div class="pattern-dot"></div>        
            <div class="pattern-dot"></div>    
        </div>

        <!-- Number Pad -->    
        <div class="number-pad">        
            <button class="number-btn" onclick="addToPattern('1')">1</button>        
            <button class="number-btn" onclick="addToPattern('2')">2</button>        
            <button class="number-btn" onclick="addToPattern('3')">3</button>        
            <button class="number-btn" onclick="addToPattern('4')">4</button>        
            <button class="number-btn" onclick="addToPattern('5')">5</button>        
            <button class="number-btn" onclick="addToPattern('6')">6</button>        
            <button class="number-btn" onclick="addToPattern('7')">7</button>        
            <button class="number-btn" onclick="addToPattern('8')">8</button>        
            <button class="number-btn" onclick="addToPattern('9')">9</button>    
        </div>

        <!-- Action Buttons -->    
        <div class="action-buttons">        
            <button class="action-btn clear-btn" onclick="clearPattern()">Clear</button>        
            <button class="action-btn submit-btn" onclick="checkPattern()">Unlock</button>    
        </div>

        <p id="error"></p>
    </div>

    <!-- Dynamic Maintenance View Overlay (Managed in real-time) -->
    <div id="maintenanceInterface" class="maintenance-container">
        <div class="maintenance-icon">🛠️</div>
        <h2 style="margin-bottom: 12px;">Under Maintenance</h2>
        <p class="subtitle" id="maintenanceNotice" style="margin-bottom: 0;">We are updating the system. Please try again shortly.</p>
    </div>
</div>

<!-- Firebase Modular Integration logic -->
<script type="module">
    // Import modular Firebase SDK (v10 CDN endpoints)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getDatabase, 
        ref, 
        onValue, 
        get, 
        set, 
        update, 
        push 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Dynamic configuration block mapping directly to Admin Portal settings [1]
    const firebaseConfig = {
        apiKey: "AIzaSyBYsiWoEOWJ35sVAIdwj1tlLzmpSEyaE5o",
        authDomain: "bhavix-site.firebaseapp.com",
        databaseURL: "https://bhavix-site-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bhavix-site",
        storageBucket: "bhavix-site.firebasestorage.app",
        messagingSenderId: "973089920463",
        appId: "1:973089920463:web:dd47c817434a852a56eeba",
        measurementId: "G-R05Y9Z9KW6"
    };

    // Initialize application connection
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Document nodes references
    const hintLineElement = document.getElementById('hintLine');
    const lockInterface = document.getElementById('lockInterface');
    const maintenanceInterface = document.getElementById('maintenanceInterface');
    const maintenanceNotice = document.getElementById('maintenanceNotice');
    const patternDots = document.querySelectorAll('.pattern-dot');
    const errorMsg = document.getElementById('error');
    const mainContainer = document.getElementById('mainContainer');

    // State parameters
    let pattern = [];
    let correctPatternString = "1616"; // Dynamically synchronized with settings/pattern
    let isChecking = false;
    let isMaintenanceActive = false;

    // Default Client Metadata Object to store finalized statistics
    let deviceInfo = {
        deviceType: "browser",
        source: "browser",
        appName: "Standard Browser",
        brand: "-",
        manufacturer: "-",
        model: "-",
        device: "-",
        product: "-",
        androidVersion: "-",
        sdkInt: 0,
        browser: "Unknown",
        userAgent: navigator.userAgent
    };

    // Browser parsing helper
    function getBrowserName(ua) {
        if (/samsungbrowser/i.test(ua)) return "Samsung Internet";
        if (/edg/i.test(ua)) return "Edge";
        
        // Detect WebView context
        const isWebView = /(wv|WebView|WebLockApp)/i.test(ua);
        if (isWebView) return "WebView";
        
        if (/chrome|crios/i.test(ua)) return "Chrome";
        if (/firefox|fxios/i.test(ua)) return "Firefox";
        if (/safari/i.test(ua) && !/chrome/i.test(ua)) return "Safari";
        
        return "Unknown";
    }

    // Device parsing helper
    function getDeviceType(ua) {
        const isWebView = /(wv|WebView|WebLockApp)/i.test(ua) || 
                          (window.Android && window.Android.showToast) || 
                          (window.webkit && window.webkit.messageHandlers);
        return isWebView ? "webview" : "browser";
    }

    // Wait & Polling System to securely grab injected variables before processing DB operations
    function resolveDeviceMetadata() {
        return new Promise((resolve) => {
            // Check instantly in case it loaded extremely fast
            if (window.WebLockAppInfo) {
                resolve(window.WebLockAppInfo);
                return;
            }

            let isResolved = false;
            
            // Event listener trigger
            const onAppReady = () => {
                if (!isResolved) {
                    isResolved = true;
                    clearInterval(pollInterval);
                    resolve(window.WebLockAppInfo);
                }
            };
            window.addEventListener("WebLockAppInfoReady", onAppReady);

            // Backup polling mechanism: checks every 200ms up to 2 seconds (10 checks max)
            let checks = 0;
            const maxChecks = 10;
            const pollInterval = setInterval(() => {
                checks++;
                if (window.WebLockAppInfo) {
                    if (!isResolved) {
                        isResolved = true;
                        window.removeEventListener("WebLockAppInfoReady", onAppReady);
                        clearInterval(pollInterval);
                        resolve(window.WebLockAppInfo);
                    }
                } else if (checks >= maxChecks) {
                    if (!isResolved) {
                        isResolved = true;
                        window.removeEventListener("WebLockAppInfoReady", onAppReady);
                        clearInterval(pollInterval);
                        resolve(null); // Fallback to normal browser mode
                    }
                }
            }, 200);
        });
    }

    // UID initialization & sync logic
    async function syncAndInitializeUser() {
        // 1. Resolve Android App Metadata with timeout polling fallback
        const appInfo = await resolveDeviceMetadata();
        
        // Print requested debug logs [1]
        console.log("WebLockAppInfo:", window.WebLockAppInfo);

        const ua = navigator.userAgent;
        const parsedBrowser = getBrowserName(ua);
        const parsedDeviceType = getDeviceType(ua);

        if (appInfo) {
            // Use injected Android WebView variables
            deviceInfo = {
                deviceType: appInfo.deviceType || "webview",
                source: appInfo.source || "android_app",
                appName: appInfo.appName || "WebLock",
                brand: appInfo.brand || "-",
                manufacturer: appInfo.manufacturer || "-",
                model: appInfo.model || "-",
                device: appInfo.device || "-",
                product: appInfo.product || "-",
                androidVersion: appInfo.androidVersion || "-",
                sdkInt: appInfo.sdkInt || 0,
                browser: "WebView",
                userAgent: ua
            };
        } else {
            // Use browser detection properties
            deviceInfo = {
                deviceType: parsedDeviceType,
                source: "browser",
                appName: "Standard Browser",
                brand: "-",
                manufacturer: "-",
                model: "-",
                device: "-",
                product: "-",
                androidVersion: "-",
                sdkInt: 0,
                browser: parsedBrowser,
                userAgent: ua
            };
        }

        // Print final constructed device specifications debug log [1]
        console.log("Final device info saved:", deviceInfo);

        // 2. Load / Generate UID reference
        let uid = localStorage.getItem('webLockUID');
        if (!uid) {
            uid = 'uid_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
            localStorage.setItem('webLockUID', uid);
        }

        const now = new Date();
        const dateString = now.toLocaleDateString();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const currentTimestampFormatted = `${dateString} ${timeString}`;

        const userRecordRef = ref(db, `users/${uid}`);

        try {
            // Retrieve pre-existing user metadata to preserve firstVisit status
            const snapshot = await get(userRecordRef);
            const data = snapshot.val();

            if (!data || !data.firstVisit) {
                // Initialize clean user profiles mapping key details [1]
                await set(userRecordRef, {
                    ...deviceInfo,
                    firstVisit: currentTimestampFormatted,
                    lastSeen: currentTimestampFormatted
                });
            } else {
                // Dynamic update lastseen timestamp and keep device variables matching current build
                await update(userRecordRef, {
                    ...deviceInfo,
                    lastSeen: currentTimestampFormatted
                });
            }
        } catch (error) {
            console.error("Failed user metadata sync transaction:", error);
        }

        return uid;
    }

    // Setup active state real-time listener mapping
    function setupRealtimeSettings() {
        const settingsRef = ref(db, 'settings');
        onValue(settingsRef, (snapshot) => {
            const settings = snapshot.val() || {};
            
            // 1. Pattern synchronization
            if (settings.pattern) {
                correctPatternString = String(settings.pattern).trim();
            }

            // 2. Hint Line synchronization
            if (settings.hintLine) {
                hintLineElement.textContent = settings.hintLine;
            } else {
                hintLineElement.textContent = "Enter Pattern to Unlock";
            }

            // 3. Maintenance control
            isMaintenanceActive = !!settings.maintenance;
            if (isMaintenanceActive) {
                lockInterface.style.display = 'none';
                maintenanceInterface.style.display = 'block';
                maintenanceNotice.textContent = settings.notice || "System maintenance in progress. Please check back later.";
            } else {
                lockInterface.style.display = 'block';
                maintenanceInterface.style.display = 'none';
            }
        }, (error) => {
            console.error("Firebase dynamic settings subscription failure:", error);
        });
    }

    // Unified interface actions
    function addToPattern(num) {    
        if (isChecking || isMaintenanceActive || pattern.length >= 4) return;

        pattern.push(num);        
        updatePatternDisplay();

        if (pattern.length === 4) {            
            isChecking = true;
            setTimeout(checkPattern, 300);        
        }
    }

    // Sync pattern view dots
    function updatePatternDisplay() {    
        patternDots.forEach((dot, index) => {        
            dot.classList.toggle('filled', index < pattern.length);    
        });
    }

    // Clear dynamic states
    function clearPattern() {    
        pattern = [];    
        isChecking = false;
        updatePatternDisplay();    
        errorMsg.innerHTML = '';    
        errorMsg.className = '';
    }

    async function checkPattern() {    
        if (pattern.length < 4) {
            errorMsg.innerHTML = 'Enter 4 digits';
            return;
        }

        isChecking = true;

        const enteredPatternString = pattern.join('');
        const isSuccess = enteredPatternString === correctPatternString;

        // Log attempts details immediately [1]
        try {
            const uid = localStorage.getItem('webLockUID') || 'anonymous_uid';

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateString = `${year}-${month}-${day}`;
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

            const attemptData = {
                status: isSuccess ? "success" : "failed",
                enteredPattern: enteredPatternString,
                date: dateString,
                time: timeString,
                timestamp: Date.now(),
                
                // Android + Browser Device Unified Context Parameters [1]
                source: deviceInfo.source,
                appName: deviceInfo.appName,
                brand: deviceInfo.brand,
                model: deviceInfo.model,
                androidVersion: deviceInfo.androidVersion,
                deviceType: deviceInfo.deviceType,
                browser: deviceInfo.browser,
                userAgent: deviceInfo.userAgent
            };

            const attemptsListRef = ref(db, `attempts/${uid}`);
            const newAttemptRef = push(attemptsListRef);
            await set(newAttemptRef, attemptData);
        } catch (error) {
            console.error("Attempt log reporting failure:", error);
        }

        // Manage UI response transitions
        if (isSuccess) {
            errorMsg.className = 'success';        
            errorMsg.innerHTML = 'Access Granted ✨';

            document.querySelectorAll('.number-btn, .action-btn').forEach(btn => {            
                btn.disabled = true;            
                btn.style.opacity = '0.5';        
            });

            setTimeout(() => {            
                window.location.href = 'https://bhavix-site.web.app/AccessPage';
            }, 1000);

        } else {
            errorMsg.className = '';        
            errorMsg.innerHTML = 'Incorrect Pattern 💔';

            mainContainer.classList.add('shake');        
            setTimeout(() => mainContainer.classList.remove('shake'), 500);

            setTimeout(clearPattern, 400);    
        }
    }

    // Attach local scope handlers directly to the global window scope for inline markup compatibility
    window.addToPattern = addToPattern;
    window.clearPattern = clearPattern;
    window.checkPattern = checkPattern;

    // Viewport lock adaptation logic
    function fixViewportHeight() {    
        document.body.style.height = window.innerHeight + "px";
    }

    window.addEventListener("load", fixViewportHeight);
    window.addEventListener("resize", fixViewportHeight);

    // Run user verification, registration, and subscribe to settings changes on initial script run
    syncAndInitializeUser().then(() => {
        setupRealtimeSettings();
    });
</script>
</body>
</html>
