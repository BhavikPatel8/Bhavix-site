<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0f172a">
<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>webLock Access</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;
    min-height:100dvh;

    display:flex;
    justify-content:center;
    align-items:center;

    background-color:#0f172a;
    background-image:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b,
            #334155
        );

    padding-left:20px;
    padding-right:20px;
    padding-bottom:20px;

    /* Status Bar Safe Area */
    padding-top:calc(env(safe-area-inset-top, 0px) + 20px);

    position:relative;

    overflow-x:hidden;
    overflow-y:auto;
}

/* Floating Glow */
body::before{
    content:'';

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:min(500px,80vw);
    height:min(500px,80vw);

    background:rgba(255,255,255,0.05);

    border-radius:50%;

    filter:blur(120px);

    pointer-events:none;

    z-index:0;
}

.container{

    position:relative;
    z-index:1;

    width:100%;
    max-width:380px;

    padding:35px;

    border-radius:24px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.35),
        0 0 30px rgba(255,255,255,0.05);

    text-align:center;
}

h2{
    color:#ffffff;
    margin-bottom:8px;
    font-weight:600;
}

.subtitle{
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:25px;
}

.select-group{
    display:flex;
    flex-direction:column;
    gap:14px;
}

select{
    width:100%;

    padding:13px;

    border:none;
    border-radius:12px;

    background:rgba(255,255,255,0.10);

    color:#ffffff;

    font-size:15px;

    outline:none;

    appearance:none;
    -webkit-appearance:none;
}

option{
    color:#000000;
}

button{

    width:100%;

    margin-top:18px;

    padding:14px;

    border:none;
    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #60a5fa,
            #3b82f6
        );

    color:#ffffff;

    font-size:15px;

    cursor:pointer;
}

button:active{
    transform:scale(0.98);
}

#error{
    margin-top:15px;
    color:#ff9f9f;
    font-size:14px;
}

.success{
    color:#7CFF9E !important;
}

@media (max-width:480px){

    body{
        padding:16px;
    }

    .container{
        padding:24px;
        max-width:100%;
    }
}
</style>
</head>

<body>

<div class="container">
    <h2> webLock </h2>
    <p class="subtitle">Enter "Mine Radha.. 🌸" Birthday Date</p>

    <div class="select-group">

        <select id="day"></select>

        <select id="month">
            <option value="">Select Month</option>
            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
            <option>May</option>
            <option>June</option>
            <option>July</option>
            <option>August</option>
            <option>September</option>
            <option>October</option>
            <option>November</option>
            <option>December</option>
        </select>

        <select id="year"></select>

    </div>

    <button onclick="checkPassword()">Unlock</button>

    <p id="error"></p>
</div>

<script>

// Days
let daySelect = document.getElementById("day");
daySelect.innerHTML = '<option value="">Select Day</option>';

for(let i=1;i<=31;i++){
    daySelect.innerHTML += `<option>${i}</option>`;
}

// Years
let yearSelect = document.getElementById("year");
yearSelect.innerHTML = '<option value="">Select Year</option>';

for(let y=2000;y<=2026;y++){
    yearSelect.innerHTML += `<option>${y}</option>`;
}

function checkPassword(){

    const day = document.getElementById("day").value;
    const month = document.getElementById("month").value;
    const year = document.getElementById("year").value;

    const msg = document.getElementById("error");

    if(
        day === "7" &&
        month === "March" &&
        year === "2007"
    ){
        msg.className = "success";
        msg.innerHTML = "Access Granted ✨";

        setTimeout(()=>{
            window.open(
    "https://bhavix-site.web.app/special",
    "_self"
);
        },1000);

    }else{
        msg.className = "";
        msg.innerHTML =
        "Incorrect Birthday Date 💔";
    }
}

</script>

</body>
</html>
