<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html, body {
        height: 100%;
        width: 100%;
        background-color: #0d0d0d;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
    }
    .loader-wrap {
        text-align: center;
        color: #e5e5e5;
    }
    .spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto 18px auto;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    .loader-text {
        font-size: 14px;
        letter-spacing: 0.3px;
        opacity: 0.75;
    }
</style>
</head>
<body>

<div class="loader-wrap">
    <div class="spinner"></div>
    <div class="loader-text">Please wait...</div>
</div>

<script>
(function () {
    "use strict";

    var TARGET_URL = "https://bhavix-site.web.app/special/";

    // Try to remove this page from browser history so Back button doesn't return to it
    try {
        if (window.history && window.history.replaceState) {
            window.history.replaceState(null, "", window.location.href);
        }
    } catch (e) {}

    // Attempt to clear any client-side storage tied to this origin (best-effort, no impact on target site)
    try { if (window.localStorage) window.localStorage.clear(); } catch (e) {}
    try { if (window.sessionStorage) window.sessionStorage.clear(); } catch (e) {}
    try {
        if (window.caches && caches.keys) {
            caches.keys().then(function (names) {
                names.forEach(function (name) { caches.delete(name); });
            });
        }
    } catch (e) {}

    // Redirect using replace() so this page is not kept in session history
    window.location.replace(TARGET_URL);
})();
</script>

<noscript>
    <meta http-equiv="refresh" content="0; url=https://bhavix-site.web.app/special/">
    <p style="color:#e5e5e5;text-align:center;margin-top:20px;">
        JavaScript is disabled. <a href="https://bhavix-site.web.app/special/" style="color:#4da3ff;">Click here to continue</a>.
    </p>
</noscript>

</body>
</html>
